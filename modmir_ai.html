<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Активное зрение — эксперимент</title>
<style>
  body {
    background: #111;
    color: #ccc;
    font-family: monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  #status {
    font-size: 20px;
    letter-spacing: 2px;
    padding: 8px 24px;
    border: 1px solid #555;
    cursor: pointer;
    user-select: none;
    margin-bottom: 12px;
  }
  #status.recall {
    color: #6f6;
    border-color: #6f6;
  }
  #status:hover { background: #222; }
  #wrap {
    position: relative;
    width: 400px;
    height: 400px;
  }
  #scene {
    image-rendering: pixelated;
    width: 400px;
    height: 400px;
  }
  #box {
    width: 24px;
    height: 24px;
    border: 2px solid #ff0;
    position: absolute;
    box-sizing: border-box;
    pointer-events: none;
    transform: translate(-50%, -50%);
  }
  #info {
    margin-top: 12px;
    font-size: 13px;
    color: #888;
    max-width: 520px;
    text-align: center;
    line-height: 1.5;
  }
  #log {
    margin-top: 10px;
    font-size: 12px;
    color: #666;
    white-space: pre;
    text-align: center;
  }
</style>
</head>
<body>

<div id="status">загрузка картинки…</div>

<div id="wrap">
  <canvas id="scene" width="50" height="50"></canvas>
  <div id="box"></div>
</div>

<div id="info">
  Фаза 1: води курсором по картинке — считываются 3×3 патчи (100 кадров).<br>
  Затем кликни на «наблюдение» → начнётся «воспоминание». Квадратик пойдёт сам.
</div>
<div id="log"></div>

<script>
// ------------------ Параметры ------------------
const SIZE = 50;
const PATCH = 3;
const MAX_FRAMES = 100;
const PERIOD_MS = 100;
const SCALE = 8; // 50 -> 400 экранных пикселей

// ------------------ Сцена ------------------
const scene = document.getElementById('scene');
const sctx = scene.getContext('2d', { willReadFrequently: true });

let imageReady = false;

function loadImage() {
  const img = new Image();
  img.onload = () => {
    sctx.fillStyle = '#000';
    sctx.fillRect(0, 0, SIZE, SIZE);
    sctx.drawImage(img, 0, 0, SIZE, SIZE);
    imageReady = true;
    phase = 'observe';
    statusEl.textContent = 'наблюдение';
    logEl.textContent = 'картинка загружена';
  };
  img.onerror = () => {
    statusEl.textContent = 'нет файла kart50x50.bmp';
    logEl.textContent = 'положи kart50x50.bmp рядом с index.html и перезагрузи страницу';
  };
  img.src = 'kart50x50.bmp';
}

// ------------------ Чтение патча ------------------
function readPatch(cx, cy) {
  const arr = new Array(PATCH * PATCH).fill(0);
  const half = (PATCH - 1) / 2;
  for (let dy = -half; dy <= half; dy++) {
    for (let dx = -half; dx <= half; dx++) {
      const x = cx + dx;
      const y = cy + dy;
      const idx = (dy + half) * PATCH + (dx + half);
      if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) {
        arr[idx] = 0;
        continue;
      }
      const d = sctx.getImageData(x, y, 1, 1).data;
      arr[idx] = (d[0] + d[1] + d[2]) / 3 | 0;
    }
  }
  return arr;
}

// ------------------ Состояние ------------------
let phase = 'loading'; // 'loading' | 'observe' | 'done' | 'recall'
let memory = [];       // [{t, x, y, dx, dy, patch:[9]}]
let lastRecordTime = 0;
let prevRecord = null; // предыдущий записанный кадр (для вычисления dx,dy)
let recallTimer = null;
let prevRecallIdx = -1;

const statusEl = document.getElementById('status');
const boxEl = document.getElementById('box');
const logEl = document.getElementById('log');
const wrap = document.getElementById('wrap');

let boxX = 25, boxY = 25;
function placeBox(x, y) {
  boxX = x; boxY = y;
  boxEl.style.left = ((x + 0.5) * SCALE) + 'px';
  boxEl.style.top  = ((y + 0.5) * SCALE) + 'px';
}

// ------------------ Фаза наблюдения ------------------
function onMouseMove(e) {
  if (phase !== 'observe') return;
  const rect = scene.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / SCALE);
  const y = Math.floor((e.clientY - rect.top) / SCALE);
  if (x < 0 || y < 0 || x >= SIZE || y >= SIZE) return;

  placeBox(x, y);

  const now = performance.now();
  if (now - lastRecordTime < PERIOD_MS) return;
  lastRecordTime = now;

  const patch = readPatch(x, y);
  // вектор движения от предыдущего записанного кадра
  const dx = prevRecord ? x - prevRecord.x : 0;
  const dy = prevRecord ? y - prevRecord.y : 0;

  const frame = { t: memory.length, x, y, dx, dy, patch };
  memory.push(frame);
  prevRecord = frame;

  logEl.textContent = `записано кадров: ${memory.length} / ${MAX_FRAMES}`;

  if (memory.length >= MAX_FRAMES) {
    phase = 'done';
    statusEl.textContent = 'воспоминание';
    statusEl.classList.add('recall');
    logEl.textContent = 'наблюдение завершено. Кликни на «воспоминание».';
  }
}

wrap.addEventListener('mousemove', onMouseMove);

// ------------------ Поиск ближайшего патча ------------------
// Исключаем prevIdx, чтобы не откатываться назад.
function nearest(patch, prevIdx) {
  let best = -1, bestD = Infinity;
  for (let i = 0; i < memory.length; i++) {
    if (i === prevIdx) continue;
    const m = memory[i];
    let d = 0;
    for (let k = 0; k < 9; k++) {
      const diff = m.patch[k] - patch[k];
      d += diff * diff;
    }
    if (d < bestD) { bestD = d; best = i; }
  }
  return { idx: best, dist: Math.sqrt(bestD) };
}

// ------------------ Фаза воспоминания ------------------
function startRecall() {
  if (phase === 'recall') {
    clearInterval(recallTimer);
    recallTimer = null;
    phase = 'done';
    statusEl.textContent = 'воспоминание (пауза)';
    return;
  }
  if (phase !== 'done') return;

  phase = 'recall';
  statusEl.textContent = 'воспоминание (идёт)';
  prevRecallIdx = -1;
  placeBox(memory[0].x, memory[0].y);

  recallTimer = setInterval(recallStep, PERIOD_MS);
}

function recallStep() {
  if (phase !== 'recall') return;

  // 1. Что я вижу сейчас?
  const curPatch = readPatch(boxX, boxY);

  // 2. Что из памяти похоже на это? (исключая прошлый шаг)
  const { idx, dist } = nearest(curPatch, prevRecallIdx);

  if (idx < 0) return;
  const m = memory[idx];

  // 3. Куда двигаться? Берём направление движения, записанное в этом кадре.
  //    Т.е. «я узнал место → иду туда, куда шёл тогда».
  const stepDx = Math.sign(m.dx);
  const stepDy = Math.sign(m.dy);

  let nx = boxX + stepDx;
  let ny = boxY + stepDy;

  // если направление нулевое — шагнём к следующему по времени кадру
  if (stepDx === 0 && stepDy === 0) {
    const nn = memory[(idx + 1) % memory.length];
    nx = boxX + Math.sign(nn.x - boxX);
    ny = boxY + Math.sign(nn.y - boxY);
  }

  // не выходим за границы
  nx = Math.max(0, Math.min(SIZE - 1, nx));
  ny = Math.max(0, Math.min(SIZE - 1, ny));

  placeBox(nx, ny);
  prevRecallIdx = idx;

  logEl.textContent =
    `idx=${idx} pos=(${nx},${ny}) ` +
    `dist=${dist.toFixed(1)} ` +
    `dir=(${m.dx},${m.dy})`;
}

// ------------------ Клик по надписи ------------------
statusEl.addEventListener('click', () => {
  if (phase === 'loading') return;
  if (phase === 'observe') {
    logEl.textContent = 'сначала подвинь курсором по картинке, чтобы записать кадры';
    return;
  }
  startRecall();
});

// ------------------ Инициализация ------------------
placeBox(25, 25);
loadImage();
</script>
</body>
</html>
