<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рулетка — каркас</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: Arial, sans-serif;
  }

  /* Канва 500x220. Увеличена в 2 раза для удобства. */
  .canvas {
    position: relative;
    width: 500px;
    height: 220px;
    background: url("fon.bmp") no-repeat center center;
    background-size: 500px 220px;
    transform: scale(2);
    transform-origin: center center;
    margin: 220px;
  }

  /* Ячейка: рамка невидима, только зона hover/клика */
  .cell {
    position: absolute;
    box-sizing: border-box;
    border: none;
    background: transparent;
    transition: background 0.12s ease;
    cursor: pointer;
    z-index: 2;
  }

  .cell:hover {
    background: rgba(255, 255, 255, 0.18);
  }

  /* Фишка поверх ячейки, по центру */
  .chip {
    position: absolute;
    width: 16px;
    height: 16px;
    background: url("ff.png") no-repeat center center;
    background-size: contain;
    pointer-events: none; /* клики проходят к ячейке */
    z-index: 3;
  }
  .dolly {
    position: absolute;
    width: 20px;
    height: 20px;
    background: url("dolly.png") no-repeat center center;
    background-size: contain;
    pointer-events: none;
    z-index: 4;
  }

  .cell .label { display: none; }

/* убираем каретку и выделение текста на канве */
.canvas {
  caret-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

.canvas * {
  caret-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* на всякий случай — убрать outline при фокусе */
.cell:focus,
.cell:focus-visible {
  outline: none;
}



</style>
</head>
<body>
<div class="canvas" id="canvas"></div>

<script>
  const cells = [
    ["перемещение", 0, 0, 11, 11],
    ["выход", 489, 0, 499, 11],

    ["баланс", 12, 8, 85, 35],
    ["сумма", 12, 36, 85, 59],
    ["число", 86, 8, 115, 35],
    ["число_ручное", 86, 36, 115, 59],

    ["инд красные_черные", 132, 8, 486, 25],
    ["инд четные_нечетные", 132, 26, 486, 43],
    ["инд малые_большие", 132, 44, 486, 61],
    ["инд невып_более_14_раз", 36, 63, 280, 76],
    ["инд вычисленные", 305, 63, 486, 76],

    ["ставка_фишки", 214, 78, 285, 89],

    ["0", 13, 92, 44, 161],

    ["1", 47, 140, 78, 161],
    ["2", 47, 116, 78, 137],
    ["3", 47, 92, 78, 113],
    ["4", 81, 140, 112, 161],
    ["5", 81, 116, 112, 137],
    ["6", 81, 92, 112, 113],
    ["7", 115, 140, 146, 161],
    ["8", 115, 116, 146, 137],
    ["9", 115, 92, 146, 113],
    ["10", 149, 140, 180, 161],
    ["11", 149, 116, 180, 137],
    ["12", 149, 92, 180, 113],

    ["13", 183, 140, 214, 161],
    ["14", 183, 116, 214, 137],
    ["15", 183, 92, 214, 113],
    ["16", 217, 140, 248, 161],
    ["17", 217, 116, 248, 137],
    ["18", 217, 92, 248, 113],
    ["19", 251, 140, 282, 161],
    ["20", 251, 116, 282, 137],
    ["21", 251, 92, 282, 113],
    ["22", 285, 140, 316, 161],
    ["23", 285, 116, 316, 137],
    ["24", 285, 92, 316, 113],

    ["25", 319, 140, 350, 161],
    ["26", 319, 116, 350, 137],
    ["27", 319, 92, 350, 113],
    ["28", 353, 140, 384, 161],
    ["29", 353, 116, 384, 137],
    ["30", 353, 92, 384, 113],
    ["31", 387, 140, 418, 161],
    ["32", 387, 116, 418, 137],
    ["33", 387, 92, 418, 113],
    ["34", 421, 140, 452, 161],
    ["35", 421, 116, 452, 137],
    ["36", 421, 92, 452, 113],

    ["колонка_1", 455, 140, 486, 161],
    ["колонка_2", 455, 116, 486, 137],
    ["колонка_3", 455, 92, 486, 113],

    ["дюжина_1_12", 47, 164, 180, 185],
    ["дюжина_2_12", 183, 164, 316, 185],
    ["дюжина_3_12", 319, 164, 452, 185],

    ["красные", 183, 188, 248, 209],
    ["четные", 115, 188, 180, 209],
    ["малые", 47, 188, 112, 209],

    ["черные", 251, 188, 316, 209],
    ["нечетные", 319, 188, 384, 209],
    ["большие", 387, 188, 452, 209],

    ["фишка_1", 458, 174, 474, 190],
    ["фишка_5", 458, 191, 474, 206],
    ["фишка_25", 475, 166, 496, 182],
    ["фишка_100", 475, 183, 496, 198],
    ["фишка_500", 475, 199, 496, 214],

    ["обнулить_ставки", 14, 181, 33, 199]
  ];

  // Ячейки, на которые можно ставить фишку
  const COLUMN_CELLS = new Set(["колонка_1", "колонка_2", "колонка_3"]);

  const canvas = document.getElementById("canvas");
  const cellEls = {}; // name -> element

  for (const [name, x1, y1, x2, y2] of cells) {
    const el = document.createElement("div");
    el.className = "cell";
    el.dataset.name = name;
    el.style.left = x1 + "px";
    el.style.top = y1 + "px";
    el.style.width = (x2 - x1) + "px";
    el.style.height = (y2 - y1) + "px";
    el.title = name;

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = name;
    el.appendChild(label);

    canvas.appendChild(el);
    cellEls[name] = el;
  }

  // Поставить фишку по центру ячейки
  function placeChip(cellName) {
    const el = cellEls[cellName];
    if (!el) return;
    if (el.querySelector(".chip")) return; // уже стоит

    const chip = document.createElement("div");
    chip.className = "chip";
    // центр ячейки
    const cx = el.offsetWidth / 2;
    const cy = el.offsetHeight / 2;
    chip.style.left = (cx - 8) + "px";
    chip.style.top = (cy - 8) + "px";
    el.appendChild(chip);
  }

  function removeChip(cellName) {
    const el = cellEls[cellName];
    if (!el) return;
    const chip = el.querySelector(".chip");
    if (chip) chip.remove();
  }

  function clearAllChips() {
    for (const name of COLUMN_CELLS) removeChip(name);
  }

 // --- маркер выигрышного номера ---
  let dollyEl = null;        // текущий маркер (или null)
  let dollyCell = null;      // ячейка, где он стоит

  function removeDolly() {
    if (dollyEl) dollyEl.remove();
    dollyEl = null;
    dollyCell = null;
  }

  function placeDolly(number) {
    removeDolly();
    const el = cellEls[String(number)];
    if (!el) return;

    const dolly = document.createElement("div");
    dolly.className = "dolly";
    const cx = el.offsetWidth / 2;
    const cy = el.offsetHeight / 2;
    dolly.style.left = (cx - 10) + "px";
    dolly.style.top = (cy - 10) + "px";
    el.appendChild(dolly);

    dollyEl = dolly;
    dollyCell = el;
  }

  // Обработчик кликов
canvas.addEventListener("click", (e) => {
    const cell = e.target.closest(".cell");
    if (!cell) return;
    const name = cell.dataset.name;

    // 1) "выход" — всегда перегенерировать и поставить новый маркер
    if (name === "выход") {
      const n = Math.floor(Math.random() * 37); // 0..36
      placeDolly(n);          // внутри placeDolly уже removeDolly()
      return;
    }

    // 2) если маркер стоит — любой другой клик его убирает
    if (dollyEl) {
      removeDolly();
      return;
    }

    // 3) обычная логика ставок
    if (COLUMN_CELLS.has(name)) {
      if (cell.querySelector(".chip")) {
        removeChip(name);
      } else {
        placeChip(name);
      }
    } else if (name === "обнулить_ставки") {
      clearAllChips();
    }
  });

</script>
</body>
</html>
