<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<!-- ===== ПРЕВЬЮ ССЫЛКИ (Open Graph + Twitter Cards) ===== -->

<!-- ===== КОНЕЦ ПРЕВЬЮ ССЫЛКИ ===== -->


  
    <meta name="full-screen" content="yes">
    <title>J_video</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .app {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #starsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            background-color: black;
            pointer-events: none;
            z-index: 1;
        }

        .center-btn {
            position: relative;
            z-index: 2;
            background: transparent;
            border: 1px solid rgba(0, 255, 255, 0.9);
            border-radius: 10px;
            width: 160px;
            height: 160px;
            max-width: 70vw;
            max-height: 70vw;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0, 255, 255, 0.7);
            font-size: 1.2rem;
            text-decoration: none;
            backdrop-filter: blur(1px);
            transition: border-color 0.2s, transform 0.1s;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.3);
            cursor: pointer;
            -webkit-touch-callout: none;
        }
        .center-btn:active {
            transform: scale(0.98);
            border-color: cyan;
            box-shadow: 0 0 20px cyan;
        }
        .center-btn span {
            opacity: 0.8;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #playerVideo {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            background: black;
            display: block;
            margin: 0 auto;
        }

        .control-panel {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 180, 255, 0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            padding: 14px 22px;
            display: flex;
            gap: 28px;
            align-items: center;
            justify-content: center;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.2s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        }
        .control-panel.visible {
            opacity: 1;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: white;
            font-size: 32px;
            line-height: 1;
            min-width: 50px;
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            text-shadow: 0 0 8px cyan;
            transition: transform 0.1s, text-shadow 0.2s;
            cursor: pointer;
            -webkit-touch-callout: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:active {
            transform: scale(1.2);
            text-shadow: 0 0 16px white, 0 0 26px cyan;
        }
        .icon-btn.close {
            font-size: 38px;
            font-weight: 300;
        }

        .hidden {
            display: none !important;
        }
        
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: cyan;
            background: rgba(0,0,0,0.7);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid cyan;
            z-index: 30;
            text-align: center;
            display: none;
        }

        /* YouTube-стиль кнопка */
        .youtube-btn {
            position: relative;
            z-index: 2;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            width: 180px;
            height: 120px;
            max-width: 65vw;
            max-height: 40vw;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
            cursor: pointer;
            -webkit-touch-callout: none;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }
        
        .youtube-play-icon {
            width: 0;
            height: 0;
            border-left: 40px solid white;
            border-top: 24px solid transparent;
            border-bottom: 24px solid transparent;
            margin-left: 8px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            transition: transform 0.2s, filter 0.2s;
        }
        
        .youtube-btn.smaller-arrow .youtube-play-icon {
            border-left: 32px solid white;
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
        }
        
        .youtube-btn:active {
            transform: scale(0.96);
            border-color: white;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        }
        
        .youtube-btn:active .youtube-play-icon {
            transform: scale(1.05);
            filter: drop-shadow(0 0 12px white);
        }
        
        @media (max-width: 480px) {
            .youtube-btn {
                width: 140px;
                height: 94px;
            }
            .youtube-play-icon {
                border-left: 30px solid white;
                border-top: 18px solid transparent;
                border-bottom: 18px solid transparent;
            }
        }

        /* ===== SEEK BAR (интерактивный прогрессбар) ===== */
        .seek-bar {
            position: absolute;
            bottom: 120px;                /* над панелью управления */
            left: 50%;
            transform: translateX(-50%);
            width: 260px;                 /* как у панели */
            height: 20px;                 /* увеличенная зона клика */
            z-index: 25;
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;         /* пока скрыт — не мешает */
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* Показываем вместе с панелью */
        .control-panel.visible ~ .seek-bar,
        .seek-bar.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Трек (фон) */
        .seek-bar-track {
            position: relative;
            width: 100%;
            height: 6px;
            background-color: rgba(128, 128, 128, 0.5);
            border-radius: 3px;
            overflow: visible;
            backdrop-filter: blur(2px);
        }

        /* Буферизация (серым) */
        .seek-bar-buffered {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: rgba(200, 200, 200, 0.5);
            border-radius: 3px;
            pointer-events: none;
        }

        /* Прогресс воспроизведения */
        .seek-bar-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background-color: white;
            border-radius: 3px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            pointer-events: none;
        }

        /* Ползунок */
        .seek-bar-thumb {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 14px;
            height: 14px;
            background-color: white;
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            box-shadow: 0 0 10px cyan, 0 0 4px white;
            pointer-events: none;
            transition: transform 0.15s ease;
        }

        .seek-bar:hover .seek-bar-thumb,
        .seek-bar.dragging .seek-bar-thumb {
            transform: translate(-50%, -50%) scale(1.25);
        }

        .seek-bar.dragging .seek-bar-progress {
            box-shadow: 0 0 16px cyan, 0 0 8px white;
        }

        /* На маленьких экранах */
        @media (max-width: 480px) {
            .seek-bar {
                width: 220px;
                bottom: 90px;
            }
        }
        @media (max-width: 600px) {
            .seek-bar {
                bottom: 90px;
            }
        }

        /* Полноэкранная подсказка */
        .fullscreen-hint {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 26;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3);
            animation: fadeOut 3s forwards;
            animation-delay: 2s;
        }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <canvas id="starsCanvas"></canvas>

        <div class="youtube-btn smaller-arrow" id="startVideoBtn" role="button" tabindex="0" aria-label="Запустить видео">
            <div class="youtube-play-icon">
                <div class="play-triangle"></div>
            </div>
        </div>

        <div class="video-container" id="videoContainer">

            <div class="error-message" id="videoError">
                Ошибка загрузки видео<br>
                Проверьте наличие файлов в папке viliv/
            </div>

            <video id="playerVideo" playsinline webkit-playsinline preload="auto"></video>

            <div class="control-panel" id="controlPanel">
                <button class="icon-btn play" id="playBtn" aria-label="Воспроизвести">▶</button>
                <button class="icon-btn pause" id="pauseBtn" aria-label="Пауза">⏸️</button>
                <button class="icon-btn next" id="nextBtn" aria-label="Следующий">⏭️</button>
                <button class="icon-btn close" id="closeBtn" aria-label="Закрыть видео">✕</button>
            </div>

            <!-- ===== SEEK BAR ===== -->
            <div class="seek-bar" id="seekBar">
                <div class="seek-bar-track" id="seekTrack">
                    <div class="seek-bar-buffered" id="seekBuffered"></div>
                    <div class="seek-bar-progress" id="seekProgress"></div>
                    <div class="seek-bar-thumb" id="seekThumb"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        (function() {
            const starsCanvas = document.getElementById('starsCanvas');
            const startBtn = document.getElementById('startVideoBtn');
            const videoContainer = document.getElementById('videoContainer');
            const playerVideo = document.getElementById('playerVideo');
            const controlPanel = document.getElementById('controlPanel');
            const playBtn = document.getElementById('playBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const nextBtn = document.getElementById('nextBtn');
            const closeBtn = document.getElementById('closeBtn');
            const videoError = document.getElementById('videoError');

            // Seek-bar элементы
            const seekBar = document.getElementById('seekBar');
            const seekTrack = document.getElementById('seekTrack');
            const seekBuffered = document.getElementById('seekBuffered');
            const seekProgress = document.getElementById('seekProgress');
            const seekThumb = document.getElementById('seekThumb');

            let hidePanelTimer = null;
            let isFirstOpen = true;
            let isDragging = false;
            let wasPlayingBeforeDrag = false;

            // ВАЖНО: Укажите правильные имена файлов
            const videoFiles = ['sb01.mp4', 'sb01.mp4'];
            let currentIndex = 0;

            // ----- Fullscreen -----
            function enterFullScreen() {
                const elem = videoContainer;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            }

            function exitFullScreen() {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }

            document.addEventListener('fullscreenchange', handleFullscreenChange);
            document.addEventListener('webkitfullscreenchange', handleFullscreenChange);
            document.addEventListener('msfullscreenchange', handleFullscreenChange);

            function handleFullscreenChange() {
                if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                    if (videoContainer.style.display === 'flex') {
                        closeVideo();
                    }
                }
            }

            // ----- Звёздный фон -----
            let stars = [];
            const ctx = starsCanvas.getContext('2d');
            const STAR_COUNT = 180;

            function initStars() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                stars = [];
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        radius: Math.random() * 2.5 + 1.2,
                        baseAlpha: Math.random() * 0.7 + 0.3,
                        speed: 0.005 + Math.random() * 0.02,
                    });
                }
            }

            function drawStars() {
                if (!ctx) return;
                const w = window.innerWidth;
                const h = window.innerHeight;
                ctx.clearRect(0, 0, w, h);
                ctx.fillStyle = 'black';
                ctx.fillRect(0, 0, w, h);

                const now = Date.now() * 0.002;
                for (let s of stars) {
                    const twinkle = Math.sin(now * s.speed * 10 + s.x * 0.02) * 0.35 + 0.65;
                    let alpha = s.baseAlpha * twinkle;
                    alpha = Math.min(1, Math.max(0.2, alpha));
                    
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 200, ${alpha})`;
                    ctx.fill();
                }
                requestAnimationFrame(drawStars);
            }

            function resizeHandler() {
                if (starsCanvas) {
                    starsCanvas.width = window.innerWidth;
                    starsCanvas.height = window.innerHeight;
                }
                initStars();
            }
            
            window.addEventListener('resize', resizeHandler);
            resizeHandler();
            drawStars();

            // ----- Панель управления -----
            function showControlPanel() {
                controlPanel.classList.add('visible');
                seekBar.classList.add('visible');
                resetHidePanelTimer();
            }

            function hideControlPanel() {
                controlPanel.classList.remove('visible');
                seekBar.classList.remove('visible');
            }

            function resetHidePanelTimer() {
                if (hidePanelTimer) clearTimeout(hidePanelTimer);
                const timeoutDuration = isFirstOpen ? 6000 : 3000;
                hidePanelTimer = setTimeout(() => {
                    controlPanel.classList.remove('visible');
                    seekBar.classList.remove('visible');
                    isFirstOpen = false;
                }, timeoutDuration);
            }

            function loadVideoByIndex(index) {
                if (index >= 0 && index < videoFiles.length) {
                    const baseUrl = window.location.origin + '/viliv/';
                    const fileName = videoFiles[index];
                    const videoUrl = baseUrl + fileName;
                    
                    console.log('Загрузка видео:', videoUrl);
                    
                    playerVideo.src = videoUrl;
                    playerVideo.load();
                    
                    playerVideo.oncanplaythrough = function() {
                        videoError.style.display = 'none';
                    };
                    
                    playerVideo.onerror = function(e) {
                        console.error('Ошибка загрузки видео:', videoUrl);
                        videoError.style.display = 'block';
                        setTimeout(() => {
                            videoError.style.display = 'none';
                        }, 3000);
                    };
                }
            }

            // ----- Логика Seek Bar -----
            function updateSeekBar() {
                if (!playerVideo.duration || isNaN(playerVideo.duration)) return;
                const percent = (playerVideo.currentTime / playerVideo.duration) * 100;
                seekProgress.style.width = percent + '%';
                seekThumb.style.left = percent + '%';
            }

            function updateBuffered() {
                if (!playerVideo.duration || isNaN(playerVideo.duration)) return;
                if (playerVideo.buffered.length > 0) {
                    const bufferedEnd = playerVideo.buffered.end(playerVideo.buffered.length - 1);
                    const percent = Math.min(100, (bufferedEnd / playerVideo.duration) * 100);
                    seekBuffered.style.width = percent + '%';
                }
            }

            function resetSeekBar() {
                seekProgress.style.width = '0%';
                seekThumb.style.left = '0%';
                seekBuffered.style.width = '0%';
            }

            // Позиция клика/тапа в процентах (0..1)
            function getRatioFromEvent(clientX) {
                const rect = seekTrack.getBoundingClientRect();
                let ratio = (clientX - rect.left) / rect.width;
                return Math.min(1, Math.max(0, ratio));
            }

            function seekToRatio(ratio) {
                if (!playerVideo.duration || isNaN(playerVideo.duration)) return;
                playerVideo.currentTime = ratio * playerVideo.duration;
                const percent = ratio * 100;
                seekProgress.style.width = percent + '%';
                seekThumb.style.left = percent + '%';
            }

            // --- Drag / click ---
            function onPointerDown(e) {
                e.stopPropagation();
                isDragging = true;
                wasPlayingBeforeDrag = !playerVideo.paused;

                seekBar.classList.add('dragging');
                seekBar.setPointerCapture && seekBar.setPointerCapture(e.pointerId);

                const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                if (clientX !== undefined) {
                    seekToRatio(getRatioFromEvent(clientX));
                }

                resetHidePanelTimer();
            }

            function onPointerMove(e) {
                if (!isDragging) return;
                e.preventDefault && e.preventDefault();
                const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0].clientX);
                if (clientX !== undefined) {
                    seekToRatio(getRatioFromEvent(clientX));
                }
            }

            function onPointerUp(e) {
                if (!isDragging) return;
                isDragging = false;
                seekBar.classList.remove('dragging');

                // Если видео играло до начала перетаскивания — продолжаем
                if (wasPlayingBeforeDrag) {
                    playerVideo.play().catch(() => {});
                }
                resetHidePanelTimer();
            }

            // Используем pointer events (работают и для мыши, и для тача в современных браузерах)
            if (window.PointerEvent) {
                seekBar.addEventListener('pointerdown', onPointerDown);
                seekBar.addEventListener('pointermove', onPointerMove);
                seekBar.addEventListener('pointerup', onPointerUp);
                seekBar.addEventListener('pointercancel', onPointerUp);
            } else {
                // Fallback: mouse + touch
                seekBar.addEventListener('mousedown', onPointerDown);
                window.addEventListener('mousemove', onPointerMove);
                window.addEventListener('mouseup', onPointerUp);

                seekBar.addEventListener('touchstart', onPointerDown, { passive: false });
                window.addEventListener('touchmove', onPointerMove, { passive: false });
                window.addEventListener('touchend', onPointerUp);
                window.addEventListener('touchcancel', onPointerUp);
            }

            // Обновление прогресса при воспроизведении
            playerVideo.addEventListener('timeupdate', updateSeekBar);
            playerVideo.addEventListener('progress', updateBuffered);
            playerVideo.addEventListener('loadedmetadata', function() {
                resetSeekBar();
                updateBuffered();
            });
            playerVideo.addEventListener('durationchange', updateBuffered);
            playerVideo.addEventListener('seeked', updateSeekBar);
            playerVideo.addEventListener('loadstart', resetSeekBar);

            // ----- Закрытие видео -----
            function closeVideo() {
                playerVideo.pause();
                exitFullScreen();
                videoContainer.style.display = 'none';
                hideControlPanel();
                if (hidePanelTimer) {
                    clearTimeout(hidePanelTimer);
                    hidePanelTimer = null;
                }
                currentIndex = 0;
                loadVideoByIndex(0);
                isFirstOpen = true;
                resetSeekBar();
            }

            // ----- Обработчики -----
            startBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                videoContainer.style.display = 'flex';
                currentIndex = 0;
                loadVideoByIndex(0);
                enterFullScreen();
                showControlPanel();
                isFirstOpen = true;
            });

            playBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playerVideo.play()
                    .then(() => {
                        showControlPanel();
                    })
                    .catch(err => {
                        console.warn('Автовоспроизведение не удалось:', err);
                        setTimeout(() => {
                            playerVideo.play().catch(e => {});
                        }, 100);
                    });
            });

            pauseBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                playerVideo.pause();
                showControlPanel();
            });

            nextBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (videoFiles.length === 0) return;
                currentIndex = (currentIndex + 1) % videoFiles.length;
                loadVideoByIndex(currentIndex);
                showControlPanel();
                resetSeekBar();
                
                setTimeout(() => {
                    playerVideo.play().catch(e => {});
                }, 200);
            });

            closeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                closeVideo();
            });

            playerVideo.addEventListener('click', (e) => {
                e.stopPropagation();
                showControlPanel();
            });

            playerVideo.addEventListener('ended', () => {
                showControlPanel();
            });

            videoContainer.addEventListener('click', (e) => {
                if (!controlPanel.contains(e.target) && !seekBar.contains(e.target)) {
                    showControlPanel();
                }
            });

            controlPanel.addEventListener('click', (e) => {
                e.stopPropagation();
                resetHidePanelTimer();
            });

            controlPanel.addEventListener('touchstart', (e) => {
                e.stopPropagation();
                resetHidePanelTimer();
            });

            // Инициализация
            hideControlPanel();
            loadVideoByIndex(0);
        })();
    </script>
</body>
</html>
