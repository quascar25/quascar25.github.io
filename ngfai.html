<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOAGI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Courier New', monospace;
    color: #b8b8b8;
    -webkit-font-smoothing: antialiased;
  }

  #stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  /* === STATEMENT === */
  #statement {
    max-width: 780px;
    padding: 0 32px;
    text-align: center;
    font-size: 17px;
    line-height: 1.7;
    letter-spacing: 0.4px;
    color: #c8c8c8;
    margin-bottom: 48px;
    font-weight: 300;
  }

  #statement .accent {
    color: #9ec5d8;
    letter-spacing: 1.5px;
  }

  /* === MAP === */
  #map-wrap {
    width: 90vw;
    max-width: 980px;
    margin-bottom: 32px;
    position: relative;
  }

  svg#map {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

 .continent {
  fill: rgba(255, 255, 255, 0.01);   /* невидимый, но ловит курсор по всей площади */
  stroke: #5a5a5a;
  stroke-width: 1.1;
  cursor: pointer;
  transition: stroke 0.35s ease, fill 0.35s ease;
  vector-effect: non-scaling-stroke;
}

.continent:hover {
  stroke: #9ec5d8;
  fill: rgba(158, 197, 216, 0.06);
}

.continent.active {
  stroke: #9ec5d8;
  fill: rgba(158, 197, 216, 0.10);   /* полупрозрачный голубой для активного */
}

.continent-label {
  fill: #7a7a7a;
  font-size: 33px;                    /* было 11 — увеличил в 3 раза */
  letter-spacing: 1.6px;
  pointer-events: none;
  transition: fill 0.35s ease;
}

.continent-label.active {
  fill: #9ec5d8;
}

  /* === JOIN BUTTON === */
 #join-btn {
  display: block;
  margin: 8px auto 0 auto;   /* auto по бокам = центр по горизонтали */
  background: transparent;
  border: 1px solid #6a6a6a;
  color: #c8c8c8;
  padding: 14px 48px;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.35s ease;
}

#join-btn:hover {
  border-color: #9ec5d8;
  color: #9ec5d8;
  letter-spacing: 4px;
}
 
  #join-btn:disabled {
    opacity: 0.3;
    cursor: default;
  }

  /* === ID VIEW === */
  #id-view {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #id-view.visible {
    display: flex;
  }

  #badge {
    width: 280px;
    height: 280px;
    position: relative;
    margin-bottom: 36px;
  }

  #badge svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  #id-code {
    font-size: 13px;
    letter-spacing: 3px;
    color: #9ec5d8;
    margin-bottom: 24px;
  }

  #id-caption {
    font-size: 11px;
    letter-spacing: 2px;
    color: #5a5a5a;
    text-align: center;
    max-width: 420px;
    line-height: 1.8;
  }

  #reset {
    margin-top: 48px;
    font-size: 10px;
    letter-spacing: 2px;
    color: #3a3a3a;
    cursor: pointer;
    background: none;
    border: none;
    font-family: inherit;
    transition: color 0.3s ease;
  }

  #reset:hover { color: #6a6a6a; }

  .hidden { display: none !important; }

  /* subtle pulse for the badge */
  @keyframes badgePulse {
    0%, 100% { opacity: 0.85; }
    50% { opacity: 1; }
  }

  #badge svg .glow {
    animation: badgePulse 4s ease-in-out infinite;
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="app">

  <!-- === REGISTRATION VIEW === -->
  <div id="reg-view">
    <div id="statement">
      <span class="accent">NOAGI</span> — <span data-i18n="statement"></span>
    </div>

    <div id="map-wrap">
      <svg id="map" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet">
        <!-- Approximate continent outlines (simplified, thin stroke) -->

        <!-- North America -->
        <path class="continent active" data-lang="en"
          d="M 120 90 L 200 70 L 260 80 L 300 100 L 290 140 L 260 170 L 240 200 L 220 230 L 200 250 L 180 240 L 170 210 L 150 190 L 130 160 L 110 130 Z"/>

        <!-- South America -->
        <path class="continent" data-lang="es"
          d="M 230 270 L 270 260 L 290 290 L 300 330 L 290 380 L 270 420 L 250 440 L 235 420 L 230 380 L 220 340 L 215 300 Z"/>

        <!-- Europe -->
        <path class="continent" data-lang="de"
          d="M 470 100 L 520 90 L 560 100 L 570 130 L 550 160 L 520 170 L 490 165 L 475 140 Z"/>

        <!-- Africa -->
        <path class="continent" data-lang="fr"
          d="M 480 190 L 540 180 L 580 200 L 600 250 L 590 310 L 560 370 L 530 400 L 500 380 L 480 330 L 470 270 L 465 220 Z"/>

        <!-- Russia -->
        <path class="continent" data-lang="ru"
          d="M 580 80 L 720 60 L 850 70 L 920 90 L 930 120 L 900 150 L 850 160 L 780 155 L 700 150 L 640 140 L 600 120 Z"/>

        <!-- China / East Asia -->
        <path class="continent" data-lang="zn"
          d="M 760 170 L 830 165 L 870 185 L 890 220 L 870 260 L 830 280 L 790 270 L 765 240 L 755 205 Z"/>

        <!-- Labels -->
        <text class="continent-label active" data-lang="en" x="205" y="160">EN</text>
        <text class="continent-label" data-lang="es" x="258" y="350">ES</text>
        <text class="continent-label" data-lang="de" x="520" y="135">DE</text>
        <text class="continent-label" data-lang="fr" x="532" y="290">FR</text>
        <text class="continent-label" data-lang="ru" x="750" y="115">RU</text>
        <text class="continent-label" data-lang="zn" x="820" y="225">ZN</text>
      </svg>
    </div>

    <button id="join-btn" data-i18n="join"></button>
  </div>

  <!-- === ID VIEW === -->
  <div id="id-view">
    <div id="badge">
      <svg viewBox="0 0 200 200">
        <defs>
          <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#9ec5d8" stop-opacity="0.95"/>
            <stop offset="45%" stop-color="#3a5a6a" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0.9"/>
          </radialGradient>
          <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#9ec5d8" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#9ec5d8" stop-opacity="0.05"/>
            <stop offset="100%" stop-color="#9ec5d8" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <circle class="glow" cx="100" cy="100" r="95" fill="url(#glowGrad)"/>
        <circle cx="100" cy="100" r="72" fill="url(#coreGrad)" stroke="#9ec5d8" stroke-width="0.8"/>
        <circle cx="100" cy="100" r="60" fill="none" stroke="#9ec5d8" stroke-width="0.4" opacity="0.5"/>
        <text id="badge-code" x="100" y="105" text-anchor="middle"
              font-family="'Courier New', monospace"
              font-size="10.5" letter-spacing="1.8" fill="#eaf4f8"></text>
      </svg>
    </div>

    <div id="id-code"></div>
    <div id="id-caption" data-i18n="caption"></div>
    <button id="reset" data-i18n="reset"></button>
  </div>

</div>

<script>
/* ============================================================
   NOAGI — local registration, anonymous, offline.
   Single file. No dependencies. No server. No tracking.
   ============================================================ */

/* ---------- i18n ---------- */
const I18N = {
  en: {
    statement: "for functional AI. A safety fund of 1 trillion dollars is necessary for public oversight of AI companies.",
    join: "Join",
    caption: "Your identifier is generated locally. It is not stored on any server. Keep it — it is your only key.",
    reset: "reset identifier"
  },
  es: {
    statement: "por una IA funcional. Es necesario un fondo de seguridad de 1 billón de dólares para el control público de las empresas de IA.",
    join: "Unirse",
    caption: "Tu identificador se genera localmente. No se almacena en ningún servidor. Consérvalo — es tu única clave.",
    reset: "restablecer identificador"
  },
  fr: {
    statement: "pour une IA fonctionnelle. Un fonds de sécurité de 1 billion de dollars est nécessaire pour le contrôle public des entreprises d'IA.",
    join: "Rejoindre",
    caption: "Votre identifiant est généré localement. Il n'est stocké sur aucun serveur. Conservez-le — c'est votre seule clé.",
    reset: "réinitialiser l'identifiant"
  },
  de: {
    statement: "für funktionale KI. Ein Sicherheitsfonds von 1 Billion Dollar ist für die öffentliche Kontrolle von KI-Unternehmen notwendig.",
    join: "Beitreten",
    caption: "Ihre Kennung wird lokal erzeugt. Sie wird auf keinem Server gespeichert. Bewahren Sie sie auf — sie ist Ihr einziger Schlüssel.",
    reset: "Kennung zurücksetzen"
  },
  ru: {
    statement: "за функциональный ИИ. Необходим фонд безопасности в 1 триллион долларов для общественного контроля над ИИ-компаниями.",
    join: "Присоединиться",
    caption: "Ваш идентификатор создан локально. Он не хранится ни на одном сервере. Сохраните его — это ваш единственный ключ.",
    reset: "сбросить идентификатор"
  },
  zn: {
    statement: "支持功能性人工智能。需要一万亿美元的安全基金，用于对人工智能公司的公众监督。",
    join: "加入",
    caption: "您的标识符在本地生成。它不存储在任何服务器上。请保管好——这是您唯一的密钥。",
    reset: "重置标识符"
  }
};

let currentLang = 'en';

/* ---------- Language switching ---------- */
function applyLang(lang) {
  currentLang = lang;
  const dict = I18N[lang] || I18N.en;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (dict[key] !== undefined) el.textContent = dict[key];
  });

  document.documentElement.lang = lang === 'zn' ? 'zh' : lang;

  document.querySelectorAll('.continent').forEach(el => {
    el.classList.toggle('active', el.dataset.lang === lang);
  });
  document.querySelectorAll('.continent-label').forEach(el => {
    el.classList.toggle('active', el.dataset.lang === lang);
  });
}

document.querySelectorAll('.continent').forEach(el => {
  el.addEventListener('click', () => applyLang(el.dataset.lang));
});

/* ---------- ID generation (local, crypto) ---------- */
function generateID() {
  const bytes = new Uint8Array(9);
  crypto.getRandomValues(bytes);

  const ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I
  let raw = '';
  for (let i = 0; i < bytes.length; i++) {
    raw += ALPHABET[bytes[i] % ALPHABET.length];
  }
  // format: XXXX-XXXX-XXXX
  return raw.slice(0, 4) + '-' + raw.slice(4, 8) + '-' + raw.slice(8, 12);
}

/* ---------- Storage ---------- */
const STORAGE_KEY = 'noagi_id_v1';

function saveID(id) { try { localStorage.setItem(STORAGE_KEY, id); } catch(e){} }
function loadID()   { try { return localStorage.getItem(STORAGE_KEY); } catch(e){ return null; } }
function clearID()  { try { localStorage.removeItem(STORAGE_KEY); } catch(e){} }

/* ---------- View switching ---------- */
const regView   = document.getElementById('reg-view');
const idView    = document.getElementById('id-view');
const joinBtn   = document.getElementById('join-btn');
const badgeCode = document.getElementById('badge-code');
const idCode    = document.getElementById('id-code');
const resetBtn  = document.getElementById('reset');

function showID(id) {
  regView.classList.add('hidden');
  idView.classList.add('visible');

  badgeCode.textContent = id;
  idCode.textContent = id;
}

function showRegistration() {
  idView.classList.remove('visible');
  regView.classList.remove('hidden');
}

joinBtn.addEventListener('click', () => {
  const id = generateID();
  saveID(id);
  showID(id);
});

resetBtn.addEventListener('click', () => {
  clearID();
  showRegistration();
});

/* ---------- Init ---------- */
(function init() {
  applyLang('en');
  const existing = loadID();
  if (existing) {
    showID(existing);
  } else {
    showRegistration();
  }
})();

/* ---------- Starfield ---------- */
(function starfield() {
  const canvas = document.getElementById('stars');
  const ctx = canvas.getContext('2d');
  let stars = [];
  let w, h, dpr;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // density: roughly one star per 6000 px^2
    const count = Math.floor((w * h) / 6000);
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: 0.35 + Math.random() * 0.7,
        base: 0.35 + Math.random() * 0.45,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.9
      });
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const tw = 0.55 + 0.45 * Math.sin(s.phase + t * 0.0006 * s.speed);
      const alpha = s.base * tw;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(210, 210, 210, ' + alpha.toFixed(3) + ')';
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(draw);
})();
</script>

</body>
</html>
