<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рулетка — макет</title>
  <link rel="icon" type="image/png" href="fff42.png">
  <link rel="apple-touch-icon" href="fff42.png">

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    user-select: none;
  }

  #stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 9 / 14));
    height: min(calc(100vw * 14 / 9), 100vh);
    background: #333;
    border: 2px solid #000;
    display: flex;
    flex-direction: column;
  }

  /* ===== ВИДЕО-БАННЕР СВЕРХУ ===== */
  #banner {
    flex: 0 0 18%;
    border: 2px solid #000;
    border-top: none;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 11px;
    margin: 4px 4px 0 4px;
    min-height: 0;
  }

  /* ===== НИЖНЯЯ ЧАСТЬ: две колонки ===== */
  #main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    padding: 4px;
  }

  /* ==== ЛЕВАЯ КОЛОНКА ==== */
  #left {
    flex: 1 1 62%;
    border-right: 3px solid #000;
    display: flex;
    flex-direction: column;
    padding: 0 4px 0 0;
    min-width: 0;
  }

  /* Сетка 5 колонок × 14 строк */
  #numbers {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    grid-template-rows: repeat(14, 1fr);
    gap: 2px;
    border: 2px solid #000;
    padding: 2px;
    min-height: 0;
  }

  .cell {
    border: 1px solid #000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ddd;
    font-size: 10px;
    font-weight: 700;
    min-width: 0;
    min-height: 0;
    text-align: center;
    overflow: hidden;
  }

  /* ---- Строка 1 ---- */
  /* кол.1-2 — теперь БАЛАНС вместо "" */
  #r1c_balance { grid-row: 1; grid-column: 1 / 3; }
  #r1c0       { grid-row: 1; grid-column: 3 / 6; }

  /* ---- Кол.1 ---- */
  #c1_118  { grid-row: 2 / 4;  grid-column: 1; }
  #c1_even { grid-row: 4 / 6;  grid-column: 1; }
  #c1_red  { grid-row: 6 / 8;  grid-column: 1; }
  #c1_blk  { grid-row: 8 / 10; grid-column: 1; }
  #c1_odd  { grid-row: 10 / 12; grid-column: 1; }
  #c1_1936 { grid-row: 12 / 14; grid-column: 1; }

  /* ---- Кол.2 ---- */
  #c2_112  { grid-row: 2 / 6;  grid-column: 2; }
  #c2_1324 { grid-row: 6 / 10; grid-column: 2; }
  #c2_2536 { grid-row: 10 / 14; grid-column: 2; }

  /* ---- Строка 14 ---- */
  .col-two-to-one { grid-row: 14; }
  /* Кнопка «×» (обнуление) — левый нижний угол таблицы */
  #clear-bets { grid-row: 14; grid-column: 1; cursor: pointer; }
  #clear-bets:active { filter: brightness(1.5); }

  /* ==== ПРАВАЯ КОЛОНКА ==== */
  #right {
    flex: 1 1 38%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 0 0 4px;
    min-width: 0;
  }

  #result-row {
    flex: 0 0 14%;
    display: flex;
    gap: 4px;
  }
  #result, #manual {
    flex: 1 1 0;
    border: 2px solid #000;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 11px;
  }
  #stats-row {
    flex: 1 1 auto;               /* статистика ещё выше — баланса больше нет */
    display: flex;
    gap: 4px;
    min-height: 0;
  }
  #history, #cold {
    flex: 1 1 0;
    border: 2px solid #000;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 10px;
    text-align: center;
  }
  #chips {
    flex: 0 0 12%;
    border: 2px solid #000;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 10px;
  }
  #buttons {
    flex: 0 0 10%;
    display: flex;
  }
  #spin {
    flex: 1 1 auto;               /* «КРУТИТЬ» на всю ширину */
    border: 2px solid #000;
    display: flex; align-items: center; justify-content: center;
    color: #888; font-size: 11px;
    font-weight: 700;
    cursor: pointer;
  }
  #spin:active { filter: brightness(1.5); }
</style>
</head>
<body>
<div id="stage">

  <!-- ===== ВИДЕО СВЕРХУ НА ВСЮ ШИРИНУ ===== -->
  <div id="banner">ВИДЕО</div>

  <!-- ===== НИЖНЯЯ ЧАСТЬ ===== -->
  <div id="main">

    <!-- ЛЕВАЯ КОЛОНКА -->
    <div id="left">
      <div id="numbers">

        <!-- Строка 1: БАЛАНС (кол.1-2) + 0 (кол.3-5) -->
        <div class="cell" id="r1c_balance">БАЛАНС</div>
        <div class="cell" id="r1c0">0</div>

        <!-- Кол.1 -->
        <div class="cell" id="c1_118">1-18</div>
        <div class="cell" id="c1_even">ЧЁТ</div>
        <div class="cell" id="c1_red">КРАСН</div>
        <div class="cell" id="c1_blk">ЧЁРН</div>
        <div class="cell" id="c1_odd">НЕЧЁТ</div>
        <div class="cell" id="c1_1936">19-36</div>

        <!-- Кол.2 -->
        <div class="cell" id="c2_112">1-12</div>
        <div class="cell" id="c2_1324">13-24</div>
        <div class="cell" id="c2_2536">25-36</div>

        <!-- Числа: строки 2-13 -->
        <div class="cell" style="grid-row:2;grid-column:3;">1</div>
        <div class="cell" style="grid-row:2;grid-column:4;">2</div>
        <div class="cell" style="grid-row:2;grid-column:5;">3</div>
        <div class="cell" style="grid-row:3;grid-column:3;">4</div>
        <div class="cell" style="grid-row:3;grid-column:4;">5</div>
        <div class="cell" style="grid-row:3;grid-column:5;">6</div>
        <div class="cell" style="grid-row:4;grid-column:3;">7</div>
        <div class="cell" style="grid-row:4;grid-column:4;">8</div>
        <div class="cell" style="grid-row:4;grid-column:5;">9</div>
        <div class="cell" style="grid-row:5;grid-column:3;">10</div>
        <div class="cell" style="grid-row:5;grid-column:4;">11</div>
        <div class="cell" style="grid-row:5;grid-column:5;">12</div>
        <div class="cell" style="grid-row:6;grid-column:3;">13</div>
        <div class="cell" style="grid-row:6;grid-column:4;">14</div>
        <div class="cell" style="grid-row:6;grid-column:5;">15</div>
        <div class="cell" style="grid-row:7;grid-column:3;">16</div>
        <div class="cell" style="grid-row:7;grid-column:4;">17</div>
        <div class="cell" style="grid-row:7;grid-column:5;">18</div>
        <div class="cell" style="grid-row:8;grid-column:3;">19</div>
        <div class="cell" style="grid-row:8;grid-column:4;">20</div>
        <div class="cell" style="grid-row:8;grid-column:5;">21</div>
        <div class="cell" style="grid-row:9;grid-column:3;">22</div>
        <div class="cell" style="grid-row:9;grid-column:4;">23</div>
        <div class="cell" style="grid-row:9;grid-column:5;">24</div>
        <div class="cell" style="grid-row:10;grid-column:3;">25</div>
        <div class="cell" style="grid-row:10;grid-column:4;">26</div>
        <div class="cell" style="grid-row:10;grid-column:5;">27</div>
        <div class="cell" style="grid-row:11;grid-column:3;">28</div>
        <div class="cell" style="grid-row:11;grid-column:4;">29</div>
        <div class="cell" style="grid-row:11;grid-column:5;">30</div>
        <div class="cell" style="grid-row:12;grid-column:3;">31</div>
        <div class="cell" style="grid-row:12;grid-column:4;">32</div>
        <div class="cell" style="grid-row:12;grid-column:5;">33</div>
        <div class="cell" style="grid-row:13;grid-column:3;">34</div>
        <div class="cell" style="grid-row:13;grid-column:4;">35</div>
        <div class="cell" style="grid-row:13;grid-column:5;">36</div>

        <!-- Строка 14: × (обнуление) в кол.1 + 2:1 в кол.3-5 -->
        <div class="cell" id="clear-bets">×</div>
        <div class="cell col-two-to-one" style="grid-column:3;">2:1</div>
        <div class="cell col-two-to-one" style="grid-column:4;">2:1</div>
        <div class="cell col-two-to-one" style="grid-column:5;">2:1</div>

      </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА -->
    <div id="right">
      <div id="result-row">
        <div id="result">ЧИСЛО</div>
        <div id="manual">ВВОД</div>
      </div>
      <div id="stats-row">
        <div id="history">ВЫПАВШИЕ</div>
        <div id="cold">НЕВЫПАВШИЕ</div>
      </div>
      <div id="chips">ФИШКИ</div>
      <div id="buttons">
        <div id="spin">КРУТИТЬ</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
