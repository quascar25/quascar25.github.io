<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рулетка — цвета и дюжины</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background:#111; color:#eee; padding:20px; }
  #wheel { width:220px; height:220px; border-radius:50%; margin:20px auto;
           display:flex; align-items:center; justify-content:center;
           font-size:42px; font-weight:bold; transition: background .1s; }
  button { padding:12px 22px; margin:6px; font-size:16px; border:none; border-radius:8px; cursor:pointer; }
  .red { background:#c0392b; color:#fff; }
  .black { background:#222; color:#fff; border:1px solid #555; }
  .green { background:#27ae60; color:#fff; }
  .dozen { background:#2c3e50; color:#fff; }
  #log { margin-top:16px; font-size:14px; color:#aaa; white-space:pre-line; }
</style>
</head>
<body>
<h2>Рулетка: цвета + дюжины</h2>
<div id="wheel">?</div>
<div>
  <button class="red" onclick="bet('red')">Красное</button>
  <button class="black" onclick="bet('black')">Чёрное</button>
  <button class="green" onclick="bet('green')">Зелёное</button>
</div>
<div>
  <button class="dozen" onclick="bet('d1')">1–12</button>
  <button class="dozen" onclick="bet('d2')">13–24</button>
  <button class="dozen" onclick="bet('d3')">25–36</button>
</div>
<div id="log">Баланс: 1000</div>

<script>
let balance = 1000;
const betAmount = 100;
const wheel = document.getElementById('wheel');
const log = document.getElementById('log');

// европейская рулетка: 0–36
function spinNumber() {
  return Math.floor(Math.random() * 37); // 0..36
}

const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];

function colorOf(n) {
  if (n === 0) return 'green';
  return redNumbers.includes(n) ? 'red' : 'black';
}

function dozenOf(n) {
  if (n >= 1 && n <= 12) return 'd1';
  if (n >= 13 && n <= 24) return 'd2';
  if (n >= 25 && n <= 36) return 'd3';
  return null;
}

function bet(type) {
  if (balance < betAmount) { log.textContent = 'Недостаточно средств'; return; }
  balance -= betAmount;

  let ticks = 0;
  const anim = setInterval(() => {
    const tmp = spinNumber();
    const c = colorOf(tmp);
    wheel.style.background = c === 'red' ? '#c0392b' : c === 'black' ? '#222' : '#27ae60';
    wheel.textContent = '?';
    if (++ticks > 12) {
      clearInterval(anim);
      const n = spinNumber();
      const c = colorOf(n);
      const d = dozenOf(n);

      wheel.style.background = c === 'red' ? '#c0392b' : c === 'black' ? '#222' : '#27ae60';
      wheel.textContent = n;

      let win = 0;
      let hit = false;

      if (type === 'red' || type === 'black' || type === 'green') {
        if (type === c) {
          hit = true;
          win = type === 'green' ? betAmount * 14 : betAmount * 2;
        }
      } else { // дюжина
        if (d === type) {
          hit = true;
          win = betAmount * 3;
        }
      }

      balance += win;

      const colorName = c === 'red' ? 'красное' : c === 'black' ? 'чёрное' : 'зелёное';
      const betName = { red:'красное', black:'чёрное', green:'зелёное',
                        d1:'1–12', d2:'13–24', d3:'25–36' }[type];

      log.textContent =
        `Выпало: ${n} (${colorName})\n` +
        `Ставка: ${betName}\n` +
        (hit ? `Выигрыш: +${win}` : 'Проигрыш') +
        `\nБаланс: ${balance}`;
    }
  }, 60);
}
</script>
</body>
</html>
