<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рулетка</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0e13;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 9 / 14));
    height: min(calc(100vw * 14 / 9), 100vh);
    background: #000;
    border: 2px solid #f0c040;
    border-radius: 8px;
    overflow: hidden;
  }

  #inner {
    position: absolute;
    inset: 5px;
    background: #12161d;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== ВЕРХ ===== */
  #top {
    flex: 0 0 auto;
    padding: 4px 4px 0 4px;
    background: #0e1218;
    border-bottom: 1px solid #232a35;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  /* Верхний ряд: два прямоугольника */
  #top-row {
    display: flex;
    gap: 4px;
    height: clamp(38px, 9vh, 68px);
  }

  .rect {
    flex: 1 1 0;
    border-radius: 6px;
    border: 2px solid #2e3a4d;
    background: #1a2130;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    position: relative;
    min-width: 0;
  }

  #result {
    font-size: clamp(18px, 5.6vh, 42px);
    cursor: pointer;
    transition: transform .08s;
  }
  #result:active { transform: scale(0.97); }
  #result.busy { cursor: wait; color: #f0c040; }
  #result.red   { background: #b3312a; }
  #result.black { background: #1c2128; }
  #result.green { background: #1e8449; }
  #result.spinning { animation: pulse .15s infinite alternate; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.4); } }

  #manual-wrap {
    padding: 0 14% 0 4%;
  }
  #manual {
    width: 100%; height: 100%;
    background: transparent; border: none;
    color: #f0c040;
    font: inherit;
    font-size: clamp(18px, 5.6vh, 42px);
    font-weight: 800;
    text-align: center;
    outline: none;
  }
  #manual::placeholder { color: #3a4553; }
  #manual-clear {
    position: absolute;
    right: 3%; top: 50%;
    transform: translateY(-50%);
    width: 24%; aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    background: #2e3a4d;
    color: #c8d2e0;
    font-size: clamp(10px, 2.4vh, 16px);
    font-weight: 700;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #manual-clear.visible { display: flex; }

  /* Статистика — длинный прямоугольник */
  #history {
    flex: 0 0 auto;
    min-height: clamp(26px, 6vh, 44px);
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 4px;
    overflow: hidden;
    cursor: pointer;
    flex-wrap: nowrap;
    justify-content: flex-end;
    transition: border-color .15s;
  }
  #history:active { border-color: #f0c040; }
  #history .title {
    position: absolute;
    left: 6px;
    font-size: clamp(6px, 1.1vh, 9px);
    color: #7a8699;
    font-weight: 600;
    letter-spacing: .5px;
    pointer-events: none;
  }
  #history { position: relative; padding-left: 44px; }

  .hist-ball {
    flex: 0 0 auto;
    width: clamp(16px, 4vh, 30px);
    height: clamp(16px, 4vh, 30px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.7vh, 12px);
    font-weight: 700;
    color: #fff;
  }
  .hist-ball.red    { background: #b3312a; }
  .hist-ball.black  { background: #1c2128; border: 1px solid #3a4553; }
  .hist-ball.green  { background: #1e8449; }

  /* Невыпавшие — длинный прямоугольник */
  #cold {
    flex: 0 0 auto;
    min-height: clamp(24px, 5.4vh, 40px);
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 4px;
    margin-bottom: 4px;
    overflow: hidden;
    cursor: pointer;
    flex-wrap: nowrap;
    justify-content: flex-end;
    transition: border-color .15s;
    position: relative;
    padding-left: 44px;
  }
  #cold:active { border-color: #f0c040; }
  #cold .title {
    position: absolute;
    left: 6px;
    font-size: clamp(6px, 1.1vh, 9px);
    color: #7a8699;
    font-weight: 600;
    letter-spacing: .5px;
    pointer-events: none;
  }
  .cold-ball {
    flex: 0 0 auto;
    width: clamp(14px, 3.6vh, 26px);
    height: clamp(14px, 3.6vh, 26px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(6px, 1.5vh, 11px);
    font-weight: 700;
    color: #fff;
    opacity: .85;
  }
  .cold-ball.red    { background: #b3312a; }
  .cold-ball.black  { background: #1c2128; border: 1px solid #3a4553; }
  .cold-ball.green  { background: #1e8449; }

  /* ===== Поле ставок ===== */
  #board {
    flex: 1 1 auto;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-height: 0;
  }

  #numbers {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1.1fr repeat(12, 1fr) 1.1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    min-height: 0;
  }

  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.7vh, 15px);
    font-weight: 700;
    color: #fff;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    position: relative;
    transition: filter .1s;
    overflow: hidden;
  }
  .cell:active { filter: brightness(1.4); }
  .cell.red   { background: #b3312a; }
  .cell.black { background: #1c2128; }
  .cell.green { background: #1e8449; }
  .cell.outside {
    background: #1a2130;
    border-color: #2e3a4d;
    color: #c8d2e0;
    font-size: clamp(7px, 1.4vh, 12px);
  }
  .cell.outside.red-bet {
    background: #b3312a;
    color: #fff;
    border-color: #8e2620;
  }
  .cell.hit { box-shadow: inset 0 0 0 2px #f0c040; }

  .bet-mark {
    position: absolute;
    top: 1px; right: 1px;
    background: #f0c040;
    color: #12161d;
    font-size: clamp(6px, 1.3vh, 10px);
    font-weight: 800;
    padding: 0 3px;
    border-radius: 6px;
    line-height: 1.3;
    pointer-events: none;
  }

  #zero { grid-column: 1; grid-row: 1 / 4; }

  #outside-bottom {
    flex: 0 0 28%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    min-height: 0;
  }

  /* ===== Низ: баланс + очистка + фишки ===== */
  #bottom {
    flex: 0 0 11%;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
    background: #0e1218;
    border-top: 1px solid #232a35;
  }

  #balance-wrap {
    flex: 0 0 40%;   /* ← вот это 28%*/
    height: 100%;
    display: flex;
    gap: 3px;
    min-width: 0;
  }

  #balance {
    flex: 1 1 auto;
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    padding: 2px 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    cursor: pointer;
  }
  #balance .lbl {
    font-size: clamp(6px, 1.2vh, 9px);
    color: #7a8699;
    font-weight: 600;
  }
  #balance .val {
    font-size: clamp(10px, 2.2vh, 18px);
    color: #f0c040;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #balance input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #f0c040;
    font: inherit;
    font-size: clamp(10px, 2.2vh, 18px);
    font-weight: 800;
    padding: 0;
  }

  #clear-bets {
    flex: 0 0 auto;
    aspect-ratio: 1;
    height: 100%;
    border-radius: 6px;
    border: 2px solid #2e3a4d;
    background: #2a1e1e;
    color: #e74c3c;
    font-size: clamp(14px, 3vh, 24px);
    font-weight: 800;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #clear-bets:active { background: #3a2828; }

  #chips {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    height: 100%;
    min-width: 0;
  }
  .chip {
    flex: 0 0 auto;
    aspect-ratio: 1;
    height: 70%;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.5vh, 12px);
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    min-width: 0;
  }
  .chip[data-v="1"]   { background: #ecf0f1; color: #12161d; }
  .chip[data-v="5"]   { background: #c0392b; }
  .chip[data-v="25"]  { background: #27ae60; }
  .chip[data-v="100"] { background: #2c3e50; }
  .chip[data-v="500"] { background: #8e44ad; }
  .chip.selected { outline: 3px solid #f0c040; outline-offset: 1px; }
</style>
</head>
<body>
<div id="stage">
  <div id="inner">

    <!-- ВЕРХ -->
    <div id="top">
      <div id="top-row">
        <div id="result" class="rect" title="Нажми, чтобы крутить">—</div>
        <div id="manual-wrap" class="rect">
          <input id="manual" type="text" inputmode="numeric" placeholder="?">
          <button id="manual-clear" title="Очистить">×</button>
        </div>
      </div>
      <div id="history">
        <span class="title">ПОСЛЕДНИЕ 12</span>
      </div>
      <div id="cold">
        <span class="title">НЕ ВЫПАДАЛИ ≥15</span>
      </div>
    </div>

    <!-- ПОЛЕ -->
    <div id="board">
      <div id="numbers">
        <div class="cell green" id="zero" data-bet="zero">0</div>
      </div>
      <div id="outside-bottom">
        <div class="cell outside" data-bet="range1">1-12</div>
        <div class="cell outside" data-bet="range2">13-24</div>
        <div class="cell outside" data-bet="range3">25-36</div>
        <div class="cell outside" data-bet="even">ЧЁТ</div>
        <div class="cell outside red-bet" data-bet="red">КРАСН</div>
        <div class="cell outside" data-bet="black">ЧЁРН</div>
      </div>
    </div>

    <!-- НИЗ -->
    <div id="bottom">
      <div id="balance-wrap">
        <div id="balance" title="Нажми, чтобы изменить">
          <div class="lbl">Баланс</div>
          <div class="val" id="balance-val">1000</div>
        </div>
        <button id="clear-bets" title="Очистить все ставки">×</button>
      </div>
      <div id="chips">
        <div class="chip" data-v="1">1</div>
        <div class="chip selected" data-v="5">5</div>
        <div class="chip" data-v="25">25</div>
        <div class="chip" data-v="100">100</div>
        <div class="chip" data-v="500">500</div>
      </div>
    </div>

  </div>
</div>

<script>
(function() {
  'use strict';

  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const COLD_THRESHOLD = 15;

  const state = {
    balance: 1000,
    selectedChip: 5,
    bets: {},
    spinning: false,
    history: [],        // последние числа, новые в начале
    spinCount: 0,       // общее число спинов (для счётчиков)
    lastSeen: {},       // число -> номер спина, когда выпало последний раз
    coldNumbers: [],    // числа, не выпадавшие >= COLD_THRESHOLD
  };

  const $ = (id) => document.getElementById(id);
  const resultEl = $('result');
  const manualEl = $('manual');
  const manualClear = $('manual-clear');
  const historyEl = $('history');
  const coldEl = $('cold');
  const balanceEl = $('balance');
  //const balanceVal = $('balance-val');
  const numbersGrid = $('numbers');

  // ---------- Генерация сетки чисел ----------
  for (let row = 0; row < 3; row++) {
    for (let col = 1; col <= 12; col++) {
      const n = col * 3 - row;
      const el = document.createElement('div');
      el.className = 'cell ' + (RED.has(n) ? 'red' : 'black');
      el.textContent = n;
      el.dataset.bet = 'num:' + n;
      numbersGrid.appendChild(el);
    }
    const colBtn = document.createElement('div');
    colBtn.className = 'cell outside';
    colBtn.textContent = '2:1';
    colBtn.dataset.bet = 'col:' + (3 - row);
    numbersGrid.appendChild(colBtn);
  }

  // ---------- Баланс ----------
function updateBalance() {
  const el = document.getElementById('balance-val');
  if (el) el.textContent = state.balance;
}

  // Редактирование баланса по клику
  balanceEl.addEventListener('click', () => {
    if (state.spinning) return;
    if (balanceEl.querySelector('input')) return;

    const old = state.balance;
    const wrap = balanceEl;
    wrap.innerHTML = '<div class="lbl">Баланс</div>';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.value = old;
    wrap.appendChild(inp);
    inp.focus();
    inp.select();

    const commit = () => {
      let v = parseInt(inp.value.replace(/[^\d]/g, ''), 10);
      if (isNaN(v)) v = old;
      v = Math.max(0, Math.min(100000, v));
      state.balance = v;
      wrap.innerHTML = '<div class="lbl">Баланс</div><div class="val" id="balance-val">' + v + '</div>';
    };
    inp.addEventListener('blur', commit, { once: true });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { inp.blur(); }
      if (e.key === 'Escape') { inp.value = old; inp.blur(); }
    });
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/[^\d]/g, '').slice(0, 6);
    });
  });

  // ---------- История ----------
  function addHistory(n) {
    state.history.unshift(n);
    if (state.history.length > 12) state.history.pop();
    renderHistory();
  }
  function renderHistory() {
    // сохраняем title
    historyEl.innerHTML = '<span class="title">ПОСЛЕДНИЕ 12</span>';
    // рендерим в обратном порядке (новые справа, т.к. justify-content: flex-end)
    const arr = state.history.slice(0, 12).reverse();
    for (const n of arr) {
      const b = document.createElement('div');
      b.className = 'hist-ball ' + colorOf(n);
      b.textContent = n;
      historyEl.appendChild(b);
    }
  }

  // ---------- Невыпавшие ----------
  function updateCold(n) {
    // увеличиваем спин-счётчик
    state.spinCount++;
    // сбрасываем счётчик для выпавшего
    state.lastSeen[n] = state.spinCount;
    // пересчитываем список
    const cold = [];
    for (let num = 0; num <= 36; num++) {
      const last = state.lastSeen[num] || 0;
      if (state.spinCount - last >= COLD_THRESHOLD) cold.push(num);
    }
    state.coldNumbers = cold;
    renderCold();
  }
  function renderCold() {
    coldEl.innerHTML = '<span class="title">НЕ ВЫПАДАЛИ ≥15</span>';
    const arr = state.coldNumbers.slice().reverse();
    for (const n of arr) {
      const b = document.createElement('div');
      b.className = 'cold-ball ' + colorOf(n);
      b.textContent = n;
      coldEl.appendChild(b);
    }
  }

  function colorOf(n) {
    if (n === 0) return 'green';
    return RED.has(n) ? 'red' : 'black';
  }

  // ---------- Ставки ----------
  function addBet(key, amount) {
    if (state.balance < amount) return false;
    state.balance -= amount;
    state.bets[key] = (state.bets[key] || 0) + amount;
    return true;
  }

  function placeBet(key) {
    if (state.spinning) return;
    if (addBet(key, state.selectedChip)) {
      updateBalance();
      renderBets();
    }
  }

  function clearBet(key) {
    if (state.spinning) return;
    const amount = state.bets[key] || 0;
    if (!amount) return;
    state.balance += amount;
    delete state.bets[key];
    updateBalance();
    renderBets();
  }

  function clearAllBets() {
    if (state.spinning) return;
    for (const [key, amt] of Object.entries(state.bets)) {
      state.balance += amt;
    }
    state.bets = {};
    updateBalance();
    renderBets();
  }

  function renderBets() {
    document.querySelectorAll('.bet-mark').forEach(m => m.remove());
    document.querySelectorAll('[data-bet]').forEach(cell => {
      const key = cell.dataset.bet;
      const amt = state.bets[key];
      if (amt) {
        const m = document.createElement('div');
        m.className = 'bet-mark';
        m.textContent = amt;
        cell.appendChild(m);
      }
    });
  }

  // Клики по клеткам поля
  let longPressTimer = null;
  document.querySelectorAll('#board [data-bet]').forEach(cell => {
    cell.addEventListener('click', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; return; }
      placeBet(cell.dataset.bet);
    });
    cell.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      clearBet(cell.dataset.bet);
    });
    cell.addEventListener('touchstart', () => {
      longPressTimer = setTimeout(() => {
        clearBet(cell.dataset.bet);
        longPressTimer = null;
      }, 500);
    }, { passive: true });
    cell.addEventListener('touchend', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    });
    cell.addEventListener('touchmove', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }, { passive: true });
  });

  // ---------- Клик по статистике: ставка по 1 на последние 12 ----------
  historyEl.addEventListener('click', () => {
    if (state.spinning) return;
    for (const n of state.history.slice(0, 12)) {
      addBet('num:' + n, 1);
    }
    updateBalance();
    renderBets();
  });

  // ---------- Клик по невыпавшим: ставка по 1 ----------
  coldEl.addEventListener('click', () => {
    if (state.spinning) return;
    for (const n of state.coldNumbers) {
      addBet('num:' + n, 1);
    }
    updateBalance();
    renderBets();
  });

  // ---------- Фишки ----------
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      state.selectedChip = parseInt(chip.dataset.v, 10);
    });
  });

  // ---------- Очистка ставок ----------
  $('clear-bets').addEventListener('click', clearAllBets);

  // ---------- Ручной ввод ----------
  function getManualValue() {
    const raw = manualEl.value.trim();
    if (raw === '') return null;
    const n = parseInt(raw, 10);
    if (isNaN(n) || n < 0 || n > 36) return null;
    return n;
  }
  function updateManualClear() {
    manualClear.classList.toggle('visible', manualEl.value.trim() !== '');
  }
  manualEl.addEventListener('input', () => {
    manualEl.value = manualEl.value.replace(/[^\d]/g, '').slice(0, 2);
    updateManualClear();
  });
  manualClear.addEventListener('click', (e) => {
    e.stopPropagation();
    manualEl.value = '';
    updateManualClear();
  });

  // ---------- Расчёт выигрыша ----------
  function calcWinnings(n) {
    let win = 0;
    const isRed = RED.has(n);
    const isBlack = n !== 0 && !isRed;

    for (const [key, amount] of Object.entries(state.bets)) {
      if (key.startsWith('num:')) {
        if (parseInt(key.slice(4), 10) === n) win += amount * 36;
      } else if (key === 'zero') {
        if (n === 0) win += amount * 36;
      } else if (key === 'red') {
        if (isRed) win += amount * 2;
      } else if (key === 'black') {
        if (isBlack) win += amount * 2;
      } else if (key === 'even') {
        if (n !== 0 && n % 2 === 0) win += amount * 2;
      } else if (key === 'range1') {
        if (n >= 1 && n <= 12) win += amount * 3;
      } else if (key === 'range2') {
        if (n >= 13 && n <= 24) win += amount * 3;
      } else if (key === 'range3') {
        if (n >= 25 && n <= 36) win += amount * 3;
      } else if (key.startsWith('col:')) {
        const col = parseInt(key.slice(4), 10);
        const actualCol = n === 0 ? 0 : ((n - 1) % 3 + 1);
        if (actualCol === col) win += amount * 3;
      }
    }
    return win;
  }

  // ---------- Кручение ----------
  function spin() {
    if (state.spinning) return;
    state.spinning = true;
    resultEl.classList.add('busy', 'spinning');
    resultEl.classList.remove('red', 'black', 'green');

    const manualVal = getManualValue();
    const finalN = manualVal !== null ? manualVal : Math.floor(Math.random() * 37);

    let ticks = 0;
    const totalTicks = 16;
    const interval = 800 / totalTicks;
    const timer = setInterval(() => {
      const rnd = Math.floor(Math.random() * 37);
      resultEl.textContent = rnd;
      resultEl.classList.remove('red', 'black', 'green');
      resultEl.classList.add(colorOf(rnd));
      ticks++;
      if (ticks >= totalTicks) {
        clearInterval(timer);
        finishSpin(finalN);
      }
    }, interval);
  }

  function finishSpin(n) {
    resultEl.textContent = n;
    resultEl.classList.remove('red', 'black', 'green', 'busy', 'spinning');
    resultEl.classList.add(colorOf(n));

    addHistory(n);
    updateCold(n);

    const win = calcWinnings(n);
    state.balance += win;

    state.bets = {};
    renderBets();
    updateBalance();

    highlightWinners(n);
    state.spinning = false;
  }

  function highlightWinners(n) {
    const winners = [];
    document.querySelectorAll('#board [data-bet]').forEach(cell => {
      const key = cell.dataset.bet;
      let hit = false;
      if (key === 'num:' + n) hit = true;
      if (key === 'zero' && n === 0) hit = true;
      if (key === 'red' && RED.has(n)) hit = true;
      if (key === 'black' && n !== 0 && !RED.has(n)) hit = true;
      if (key === 'even' && n !== 0 && n % 2 === 0) hit = true;
      if (key === 'range1' && n >= 1 && n <= 12) hit = true;
      if (key === 'range2' && n >= 13 && n <= 24) hit = true;
      if (key === 'range3' && n >= 25 && n <= 36) hit = true;
      if (key.startsWith('col:') && n !== 0 && ((n - 1) % 3 + 1) === parseInt(key.slice(4), 10)) hit = true;
      if (hit) { cell.classList.add('hit'); winners.push(cell); }
    });
    setTimeout(() => winners.forEach(c => c.classList.remove('hit')), 800);
  }

  resultEl.addEventListener('click', spin);

  // Инициализация
  updateBalance();
  updateManualClear();
  renderHistory();
  renderCold();
  renderBets();
})();
</script>
</body>
</html>
