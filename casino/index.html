<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Рулетка — ставки + спин по кругу</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; background:#111; color:#eee; padding:20px; }
  #wheel { width:220px; height:220px; border-radius:50%; margin:20px auto;
           display:flex; align-items:center; justify-content:center;
           font-size:42px; font-weight:bold; cursor:pointer;
           background:#333; transition: background .1s; user-select:none; }
  #wheel:active { transform: scale(0.97); }
  button { padding:10px 18px; margin:5px; font-size:15px; border:none; border-radius:8px; cursor:pointer; }
  .red { background:#c0392b; color:#fff; }
  .black { background:#222; color:#fff; border:1px solid #555; }
  .green { background:#27ae60; color:#fff; }
  .dozen { background:#2c3e50; color:#fff; }
  .clear { background:#7f8c8d; color:#fff; }
  #bets { margin-top:10px; font-size:14px; color:#f1c40f; white-space:pre-line; min-height:40px; }
  #log { margin-top:10px; font-size:14px; color:#aaa; white-space:pre-line; }
</style>
</head>
<body>
<h2>Рулетка: набери ставки → жми на круг</h2>

<div id="wheel" onclick="spin()">?</div>

<div>
  <button class="red" onclick="addBet('red')">Красное</button>
  <button class="black" onclick="addBet('black')">Чёрное</button>
  <button class="green" onclick="addBet('green')">Зелёное</button>
</div>
<div>
  <button class="dozen" onclick="addBet('d1')">1–12</button>
  <button class="dozen" onclick="addBet('d2')">13–24</button>
  <button class="dozen" onclick="addBet('d3')">25–36</button>
</div>
<div>
  <button class="clear" onclick="clearBets()">Очистить ставки</button>
</div>

<div id="bets">Ставок нет</div>
<div id="log">Баланс: 1000</div>

<script>
let balance = 1000;
const betAmount = 100;
let pendingBets = []; // массив типов ставок на текущий спин
let spinning = false;

const wheel = document.getElementById('wheel');
const betsEl = document.getElementById('bets');
const log = document.getElementById('log');

const redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
const betNames = { red:'красное', black:'чёрное', green:'зелёное', d1:'1–12', d2:'13–24', d3:'25–36' };

function colorOf(n) {
  if (n === 0) return 'green';
  return redNumbers.includes(n) ? 'red' : 'black';
}
function dozenOf(n) {
  if (n >= 1 && n <= 12) return 'd1';
  if (n >= 13 && n <= 24) return 'd2';
  if (n >= 25 && n <= 36) return 'd3';
  return null;
}

function renderBets() {
  if (pendingBets.length === 0) { betsEl.textContent = 'Ставок нет'; return; }
  betsEl.textContent = 'Текущие ставки: ' + pendingBets.map(t => betNames[t]).join(', ') +
                       '  (каждая ' + betAmount + ')';
}

function addBet(type) {
  if (spinning) return;
  if (balance < betAmount) { log.textContent = 'Недостаточно средств'; return; }
  balance -= betAmount;
  pendingBets.push(type);
  renderBets();
  log.textContent = 'Баланс: ' + balance;
}

function clearBets() {
  if (spinning) return;
  balance += pendingBets.length * betAmount;
  pendingBets = [];
  renderBets();
  log.textContent = 'Ставки сняты. Баланс: ' + balance;
}

function spin() {
  if (spinning) return;
  if (pendingBets.length === 0) { log.textContent = 'Сначала сделай ставку'; return; }

  spinning = true;
  let ticks = 0;
  const anim = setInterval(() => {
    const tmp = Math.floor(Math.random() * 37);
    const c = colorOf(tmp);
    wheel.style.background = c === 'red' ? '#c0392b' : c === 'black' ? '#222' : '#27ae60';
    wheel.textContent = '?';
    if (++ticks > 12) {
      clearInterval(anim);
      const n = Math.floor(Math.random() * 37);
      const c = colorOf(n);
      const d = dozenOf(n);

      wheel.style.background = c === 'red' ? '#c0392b' : c === 'black' ? '#222' : '#27ae60';
      wheel.textContent = n;

      let totalWin = 0;
      let details = [];

      for (const type of pendingBets) {
        let win = 0;
        if (type === 'red' || type === 'black' || type === 'green') {
          if (type === c) win = type === 'green' ? betAmount * 14 : betAmount * 2;
        } else if (type === d) {
          win = betAmount * 3;
        }
        totalWin += win;
        details.push(`${betNames[type]}: ${win ? '+' + win : '0'}`);
      }

      balance += totalWin;

      const colorName = c === 'red' ? 'красное' : c === 'black' ? 'чёрное' : 'зелёное';
      log.textContent =
        `Выпало: ${n} (${colorName})\n` +
        details.join('\n') + '\n' +
        `Итого: ${totalWin ? '+' + totalWin : '0'}\n` +
        `Баланс: ${balance}`;

      pendingBets = [];
      renderBets();
      spinning = false;
    }
  }, 60);
}

renderBets();
</script>
</body>
</html>
