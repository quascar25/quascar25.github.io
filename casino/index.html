<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рулетка</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0e13;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  /* ===== Внешняя рама 9:14 ===== */
  #stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 9 / 14));
    height: min(calc(100vw * 14 / 9), 100vh);
    background: #000;
    border: 2px solid #f0c040;
    border-radius: 8px;
    overflow: hidden;
  }

  /* Внутренний бордюр 5px */
  #inner {
    position: absolute;
    inset: 5px;
    background: #12161d;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== ВЕРХ: два квадрата + статистика ===== */
  #top {
    flex: 0 0 22%;
    display: flex;
    gap: 4px;
    padding: 4px;
    background: #0e1218;
    border-bottom: 1px solid #232a35;
    min-height: 0;
  }

  .square {
    flex: 0 0 auto;
    aspect-ratio: 1 / 1;
    height: 100%;
    border-radius: 6px;
    border: 2px solid #2e3a4d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    color: #fff;
    position: relative;
    min-width: 0;
  }

  /* Левый квадрат = результат + кнопка крутить */
  #result {
    background: #1a2130;
    font-size: clamp(20px, 8vh, 60px);
    cursor: pointer;
    transition: transform .08s;
  }
  #result:active { transform: scale(0.96); }
  #result.busy {
    cursor: wait;
    color: #f0c040;
  }
  #result.red   { background: #b3312a; }
  #result.black { background: #1c2128; }
  #result.green { background: #1e8449; }
  #result.spinning { animation: pulse .15s infinite alternate; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.5); } }

  /* Правый квадрат = ручной ввод */
  #manual-wrap {
    background: #1a2130;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 0 18% 0 6%;
  }
  #manual {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    color: #f0c040;
    font: inherit;
    font-size: clamp(20px, 8vh, 60px);
    font-weight: 800;
    text-align: center;
    outline: none;
    -moz-appearance: textfield;
  }
  #manual::-webkit-outer-spin-button,
  #manual::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  #manual::placeholder { color: #3a4553; }
  #manual-clear {
    position: absolute;
    right: 4%;
    top: 50%;
    transform: translateY(-50%);
    width: 28%;
    aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    background: #2e3a4d;
    color: #c8d2e0;
    font-size: clamp(11px, 3vh, 18px);
    font-weight: 700;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #manual-clear.visible { display: flex; }

  /* Статистика справа */
  #history {
    flex: 1 1 auto;
    min-width: 0;
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 0 4px;
    overflow: hidden;
    flex-wrap: wrap;
    align-content: center;
    justify-content: flex-end;
  }
  .hist-ball {
    flex: 0 0 auto;
    width: clamp(14px, 4.4vh, 30px);
    height: clamp(14px, 4.4vh, 30px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.9vh, 13px);
    font-weight: 700;
    color: #fff;
  }
  .hist-ball.red    { background: #b3312a; }
  .hist-ball.black  { background: #1c2128; border: 1px solid #3a4553; }
  .hist-ball.green  { background: #1e8449; }

  /* ===== Поле ставок ===== */
  #board {
    flex: 1 1 auto;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    min-height: 0;
  }

  #numbers {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1.1fr repeat(12, 1fr) 1.1fr;
    grid-template-rows: repeat(3, 1fr);
    gap: 2px;
    min-height: 0;
  }

  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.7vh, 15px);
    font-weight: 700;
    color: #fff;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    position: relative;
    transition: filter .1s;
    overflow: hidden;
  }
  .cell:active { filter: brightness(1.4); }
  .cell.red   { background: #b3312a; }
  .cell.black { background: #1c2128; }
  .cell.green { background: #1e8449; }
  .cell.outside {
    background: #1a2130;
    border-color: #2e3a4d;
    color: #c8d2e0;
    font-size: clamp(7px, 1.4vh, 12px);
  }
  .cell.hit { box-shadow: inset 0 0 0 2px #f0c040; }

  /* Метка ставки на клетке */
  .bet-mark {
    position: absolute;
    top: 1px; right: 1px;
    background: #f0c040;
    color: #12161d;
    font-size: clamp(6px, 1.3vh, 10px);
    font-weight: 800;
    padding: 0 3px;
    border-radius: 6px;
    line-height: 1.3;
    pointer-events: none;
  }

  #zero {
    grid-column: 1;
    grid-row: 1 / 4;
  }

  #outside-bottom {
    flex: 0 0 28%;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 2px;
    min-height: 0;
  }

  /* ===== Нижняя панель: баланс + фишки ===== */
  #bottom {
    flex: 0 0 11%;
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px;
    background: #0e1218;
    border-top: 1px solid #232a35;
  }

  #balance {
    flex: 0 0 30%;
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    padding: 2px 6px;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
  }
  #balance .lbl {
    font-size: clamp(6px, 1.3vh, 10px);
    color: #7a8699;
    font-weight: 600;
  }
  #balance .val {
    font-size: clamp(11px, 2.4vh, 20px);
    color: #f0c040;
    font-weight: 800;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #chips {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 2px;
    height: 100%;
    min-width: 0;
  }
  .chip {
    flex: 0 0 auto;
    aspect-ratio: 1;
    height: 86%;
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.5vh, 12px);
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    min-width: 0;
  }
  .chip[data-v="1"]   { background: #ecf0f1; color: #12161d; }
  .chip[data-v="5"]   { background: #c0392b; }
  .chip[data-v="25"]  { background: #27ae60; }
  .chip[data-v="100"] { background: #2c3e50; }
  .chip[data-v="500"] { background: #8e44ad; }
  .chip.selected { outline: 3px solid #f0c040; outline-offset: 1px; }

  /* Правый клик / долгое нажатие для снятия ставки */
  #hint {
    position: absolute;
    bottom: 100%;
    left: 0;
    font-size: 10px;
    color: #7a8699;
    padding: 2px 4px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="inner">

    <!-- ВЕРХ -->
    <div id="top">
      <div id="result" class="square" title="Нажми, чтобы крутить">—</div>
      <div id="manual-wrap" class="square" style="background:#1a2130;">
        <input id="manual" type="text" inputmode="numeric" placeholder="?">
        <button id="manual-clear" title="Очистить">×</button>
      </div>
      <div id="history"></div>
    </div>

    <!-- ПОЛЕ -->
    <div id="board">
      <div id="numbers">
        <div class="cell green" id="zero" data-bet="zero">0</div>
      </div>
      <div id="outside-bottom">
        <div class="cell outside" data-bet="range1">1-12</div>
        <div class="cell outside" data-bet="range2">13-24</div>
        <div class="cell outside" data-bet="range3">25-36</div>
        <div class="cell outside" data-bet="even">ЧЁТ</div>
        <div class="cell outside" data-bet="red">КРАСН</div>
        <div class="cell outside" data-bet="black">ЧЁРН</div>
      </div>
    </div>

    <!-- НИЗ -->
    <div id="bottom">
      <div id="balance">
        <div class="lbl">Баланс</div>
        <div class="val" id="balance-val">1000</div>
      </div>
      <div id="chips">
        <div class="chip" data-v="1">1</div>
        <div class="chip selected" data-v="5">5</div>
        <div class="chip" data-v="25">25</div>
        <div class="chip" data-v="100">100</div>
        <div class="chip" data-v="500">500</div>
      </div>
    </div>

  </div>
</div>

<script>
(function() {
  'use strict';

  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);

  const state = {
    balance: 1000,
    selectedChip: 5,
    bets: {},          // betKey -> amount
    spinning: false,
    history: [],
  };

  const $ = (id) => document.getElementById(id);
  const resultEl = $('result');
  const manualEl = $('manual');
  const manualClear = $('manual-clear');
  const historyEl = $('history');
  const balanceVal = $('balance-val');
  const numbersGrid = $('numbers');

  // ---------- Генерация сетки чисел ----------
  // Порядок как на реальном столе: сверху ряд 3,6,9..., затем 2,5,8..., затем 1,4,7...
  for (let row = 0; row < 3; row++) {
    for (let col = 1; col <= 12; col++) {
      const n = col * 3 - row;
      const el = document.createElement('div');
      el.className = 'cell ' + (RED.has(n) ? 'red' : 'black');
      el.textContent = n;
      el.dataset.bet = 'num:' + n;
      numbersGrid.appendChild(el);
    }
    const colBtn = document.createElement('div');
    colBtn.className = 'cell outside';
    colBtn.textContent = '2:1';
    colBtn.dataset.bet = 'col:' + (3 - row); // колонка 1,2,3
    numbersGrid.appendChild(colBtn);
  }

  // ---------- Баланс ----------
  function updateBalance() {
    balanceVal.textContent = state.balance;
  }

  // ---------- История ----------
  function addHistory(n) {
    state.history.unshift(n);
    if (state.history.length > 12) state.history.pop();
    renderHistory();
  }
  function renderHistory() {
    historyEl.innerHTML = '';
    for (const n of state.history) {
      const b = document.createElement('div');
      b.className = 'hist-ball ' + colorOf(n);
      b.textContent = n;
      historyEl.appendChild(b);
    }
  }

  function colorOf(n) {
    if (n === 0) return 'green';
    return RED.has(n) ? 'red' : 'black';
  }

  // ---------- Ставки ----------
  function placeBet(key) {
    if (state.spinning) return;
    const amount = state.selectedChip;
    if (state.balance < amount) return;
    state.balance -= amount;
    state.bets[key] = (state.bets[key] || 0) + amount;
    updateBalance();
    renderBets();
  }

  function clearBet(key) {
    if (state.spinning) return;
    const amount = state.bets[key] || 0;
    if (!amount) return;
    state.balance += amount;
    delete state.bets[key];
    updateBalance();
    renderBets();
  }

  function renderBets() {
    // Снять метки
    document.querySelectorAll('.bet-mark').forEach(m => m.remove());
    // Поставить метки
    document.querySelectorAll('[data-bet]').forEach(cell => {
      const key = cell.dataset.bet;
      const amt = state.bets[key];
      if (amt) {
        const m = document.createElement('div');
        m.className = 'bet-mark';
        m.textContent = amt;
        cell.appendChild(m);
      }
    });
  }

  // Клик по клетке — ставка. Долгое нажатие / правый клик — снять.
  let longPressTimer = null;
  document.querySelectorAll('[data-bet]').forEach(cell => {
    cell.addEventListener('click', (e) => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; return; }
      placeBet(cell.dataset.bet);
    });
    cell.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      clearBet(cell.dataset.bet);
    });
    cell.addEventListener('touchstart', (e) => {
      longPressTimer = setTimeout(() => {
        clearBet(cell.dataset.bet);
        longPressTimer = null;
      }, 500);
    }, { passive: true });
    cell.addEventListener('touchend', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    });
    cell.addEventListener('touchmove', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }, { passive: true });
  });

  // ---------- Фишки ----------
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      state.selectedChip = parseInt(chip.dataset.v, 10);
    });
  });

  // ---------- Ручной ввод ----------
  function getManualValue() {
    const raw = manualEl.value.trim();
    if (raw === '') return null;
    const n = parseInt(raw, 10);
    if (isNaN(n) || n < 0 || n > 36) return null;
    return n;
  }

  function updateManualClear() {
    manualClear.classList.toggle('visible', manualEl.value.trim() !== '');
  }
  manualEl.addEventListener('input', () => {
    // Только цифры
    manualEl.value = manualEl.value.replace(/[^\d]/g, '').slice(0, 2);
    updateManualClear();
  });
  manualClear.addEventListener('click', (e) => {
    e.stopPropagation();
    manualEl.value = '';
    updateManualClear();
  });

  // ---------- Расчёт выигрыша ----------
  function calcWinnings(n) {
    let win = 0;
    const isRed = RED.has(n);
    const isBlack = n !== 0 && !isRed;

    for (const [key, amount] of Object.entries(state.bets)) {
      if (key.startsWith('num:')) {
        const num = parseInt(key.slice(4), 10);
        if (num === n) win += amount * 36;
      } else if (key === 'zero') {
        if (n === 0) win += amount * 36;
      } else if (key === 'red') {
        if (isRed) win += amount * 2;
      } else if (key === 'black') {
        if (isBlack) win += amount * 2;
      } else if (key === 'even') {
        if (n !== 0 && n % 2 === 0) win += amount * 2;
      } else if (key === 'range1') {
        if (n >= 1 && n <= 12) win += amount * 3;
      } else if (key === 'range2') {
        if (n >= 13 && n <= 24) win += amount * 3;
      } else if (key === 'range3') {
        if (n >= 25 && n <= 36) win += amount * 3;
      } else if (key.startsWith('col:')) {
        const col = parseInt(key.slice(4), 10);
        const inCol = n !== 0 && Math.ceil(n / 3) === col;
        if (inCol) win += amount * 3;
      }
    }
    return win;
  }

  // ---------- Кручение ----------
  function spin() {
    if (state.spinning) return;

    // Проверка: если есть ставки, но баланс на нуле и ставок нет — не крутим
    // (можно крутить без ставок — просто смотрим число)

    state.spinning = true;
    resultEl.classList.add('busy', 'spinning');
    resultEl.classList.remove('red', 'black', 'green');

    const manualVal = getManualValue();
    const finalN = manualVal !== null ? manualVal : Math.floor(Math.random() * 37);

    // Анимация мелькания
    let ticks = 0;
    const totalTicks = 16;
    const interval = 800 / totalTicks;
    const timer = setInterval(() => {
      const rnd = Math.floor(Math.random() * 37);
      resultEl.textContent = rnd;
      resultEl.classList.remove('red', 'black', 'green');
      resultEl.classList.add(colorOf(rnd));
      ticks++;
      if (ticks >= totalTicks) {
        clearInterval(timer);
        finishSpin(finalN);
      }
    }, interval);
  }

  function finishSpin(n) {
    // Показываем финальное число
    resultEl.textContent = n;
    resultEl.classList.remove('red', 'black', 'green', 'busy', 'spinning');
    resultEl.classList.add(colorOf(n));

    // Статистика
    addHistory(n);

    // Расчёт
    const win = calcWinnings(n);
    state.balance += win;

    // Очистка ставок (они сыграли)
    // Если хочешь, чтобы ставки оставались — закомментируй следующую строку
    state.bets = {};
    renderBets();
    updateBalance();

    // Подсветка выигрышных клеток на секунду
    highlightWinners(n);
    state.spinning = false;
  }

  function highlightWinners(n) {
    const winners = [];
    document.querySelectorAll('[data-bet]').forEach(cell => {
      const key = cell.dataset.bet;
      let hit = false;
      if (key === 'num:' + n) hit = true;
      if (key === 'zero' && n === 0) hit = true;
      if (key === 'red' && RED.has(n)) hit = true;
      if (key === 'black' && n !== 0 && !RED.has(n)) hit = true;
      if (key === 'even' && n !== 0 && n % 2 === 0) hit = true;
      if (key === 'range1' && n >= 1 && n <= 12) hit = true;
      if (key === 'range2' && n >= 13 && n <= 24) hit = true;
      if (key === 'range3' && n >= 25 && n <= 36) hit = true;
      if (key.startsWith('col:') && n !== 0 && Math.ceil(n / 3) === parseInt(key.slice(4), 10)) hit = true;
      if (hit) {
        cell.classList.add('hit');
        winners.push(cell);
      }
    });
    setTimeout(() => winners.forEach(c => c.classList.remove('hit')), 800);
  }

  // Левый квадрат — кнопка крутить
  resultEl.addEventListener('click', spin);

  // Инициализация
  updateBalance();
  updateManualClear();
  renderBets();
})();
</script>
</body>
</html>
