<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рама 9:14</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0e13;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 9 / 14));
    height: min(calc(100vw * 14 / 9), 100vh);
    background: #12161d;
    border: 2px solid #f0c040;
    border-radius: 8px;
  }
</style>
</head>
<body>
  <div id="stage"></div>
</body>
</html>
