<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Рулетка</title>
   <link rel="icon" type="image/png" href="fff42.png">
  <link rel="apple-touch-icon" href="fff42.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0e13;
    overflow: hidden;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 9 / 14));
    height: min(calc(100vw * 14 / 9), 100vh);
    background: #000;
    border: 2px solid #f0c040;
    border-radius: 8px;
    overflow: hidden;
  }

  #inner {
    position: absolute;
    inset: 5px;
    background: #12161d;
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== ВЕРХ: баннер ===== */
  #banner {
    flex: 0 0 auto;
    height: 100px;
    margin: 4px 4px 0 4px;
    background: #1a2130 url('rf.jpg') center/contain no-repeat;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  #banner-video {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    background: transparent;
  }
  #sound-toggle {
    position: absolute;
    right: 6px; bottom: 6px;
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1px solid #2e3a4d;
    background: rgba(14,18,24,0.8);
    color: #c8d2e0;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 2; padding: 0;
  }
  #sound-toggle:active { transform: scale(0.95); }

  /* ===== НИЖНЯЯ ЧАСТЬ: две колонки ===== */
  #main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    padding: 4px;
  }

  /* ==== ЛЕВАЯ КОЛОНКА ==== */
  #left {
    flex: 1 1 72%;            /* flex: 1 1 62%;   */
    border-right: 3px solid #232a35;
    display: flex;
    flex-direction: column;
    padding: 0 4px 0 0;
    min-width: 0;
  }

  #numbers {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    grid-template-rows: repeat(14, 1fr);
    gap: 2px;
    min-height: 0;
  }

  .cell {
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.7vh, 15px);
    font-weight: 700;
    color: #fff;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    position: relative;
    transition: filter .1s;
    overflow: hidden;
    min-width: 0; min-height: 0;
  }
  .cell:active { filter: brightness(1.4); }
  .cell.red   { background: #b3312a; }
  .cell.black { background: #1c2128; }
  .cell.green { background: #1e8449; }
  .cell.outside {
    background: #1a2130;
    border-color: #2e3a4d;
    color: #c8d2e0;
    font-size: clamp(7px, 1.4vh, 12px);
  }
  .cell.outside.red-bet {
    background: #b3312a;
    color: #fff;
    border-color: #8e2620;
  }
  .cell.hit { box-shadow: inset 0 0 0 2px #f0c040; }

  .bet-mark {
    position: absolute;
    top: 1px; right: 1px;
    background: #f0c040;
    color: #12161d;
    font-size: clamp(6px, 1.3vh, 10px);
    font-weight: 800;
    padding: 0 3px;
    border-radius: 6px;
    line-height: 1.3;
    pointer-events: none;
  }

  /* ---- Сетка 5×14 ---- */
  #r1c_balance { grid-row: 1; grid-column: 1 / 3; }
  #zero        { grid-row: 1; grid-column: 3 / 6; }

  #c1_118  { grid-row: 2 / 4;  grid-column: 1; }
  #c1_even { grid-row: 4 / 6;  grid-column: 1; }
  #c1_red  { grid-row: 6 / 8;  grid-column: 1; }
  #c1_blk  { grid-row: 8 / 10; grid-column: 1; }
  #c1_odd  { grid-row: 10 / 12; grid-column: 1; }
  #c1_1936 { grid-row: 12 / 14; grid-column: 1; }

  #c2_112  { grid-row: 2 / 6;  grid-column: 2; }
  #c2_1324 { grid-row: 6 / 10; grid-column: 2; }
  #c2_2536 { grid-row: 10 / 14; grid-column: 2; }

  .col-two-to-one { grid-row: 14; }

  /* Баланс в объединённой ячейке 1-2 первой строки */
  #r1c_balance {
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 3px;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    padding: 0 6px;     /* ← уменьши c 6px до 0 2px, если нужно */
    /*overflow: hidden; */
 }
  #r1c_balance .lbl {
    font-size: clamp(7px, 1.4vh, 10px);
    color: #7a8699;
    font-weight: 700;
  }
  #r1c_balance .val {
    font-size: clamp(11px, 3.4vh, 20px);
    color: #f0c040;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #r1c_balance input {
    width: 100%;           
    max-width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: #f0c040;
    font: inherit;
    font-size: clamp(11px, 3.4vh, 20px);
    font-weight: 600;
    padding: 0;
    text-align: right;
    direction: rtl;
    /* margin-left: auto;           прижать вправо */
  }

  /* Кнопка × (очистка ставок) в левом нижнем углу */
  #clear-bets {
    grid-row: 14; grid-column: 1;
    background: #2a1e1e;
    color: #e74c3c;
    font-size: clamp(14px, 3vh, 24px);
    font-weight: 800;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
  }
  #clear-bets:active { background: #3a2828; }

  /* ==== ПРАВАЯ КОЛОНКА ==== */
  #right {
    flex: 1 1 28%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 0 0 0 4px;
    min-width: 0;
  }

  #result-row {
    flex: 0 0 calc(100% / 14);
    display: flex;
    gap: 4px;
    min-height: 0;
  }
  #result, #manual-wrap {
    flex: 1 1 50%;               /* было  flex: 1 1 0; */
    border-radius: 6px;
    border: 2px solid #2e3a4d;
    background: #1a2130;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;           /* полужирный , было 800 */
    color: #fff;
    position: relative;
    min-width: 0;
    overflow: hidden;
  }
  #result {
    /* font-size: clamp(18px, 5.6vh, 42px); */
    font-size: clamp(14.4px, 4.48vh, 33.6px);
    cursor: pointer;
    transition: transform .08s;
  }
  #result:active { transform: scale(0.97); }
  #result.busy { cursor: wait; color: #f0c040; }
  #result.red   { background: #b3312a; }
  #result.black { background: #1c2128; }
  #result.green { background: #1e8449; }
  #result.spinning { animation: pulse .6s infinite alternate; }
  @keyframes pulse { from { filter: brightness(1); } to { filter: brightness(1.35); } }

  #manual-wrap { padding: 0 14% 0 4%; }
  #manual {
    width: 100%; height: 100%;
    background: transparent; border: none;
    color: #f0c040;
    font: inherit;
    /* font-size: clamp(18px, 5.6vh, 42px);   */
    font-size: clamp(14.4px, 4.48vh, 33.6px);
    font-weight: 600;            /* полужирный , было 800 */
    text-align: center;
    outline: none;
  }
  #manual::placeholder { color: #3a4553; }
  #manual-clear {
    position: absolute;
    right: 3%; top: 50%;
    transform: translateY(-50%);
    width: 24%; aspect-ratio: 1;
    border-radius: 50%;
    border: none;
    background: #2e3a4d;
    color: #c8d2e0;
    font-size: clamp(10px, 2.4vh, 16px);
    font-weight: 700;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
  }
  #manual-clear.visible { display: flex; }

  /* Статистика — ДВА столбика, ОДИН номер на строку, СВЕРХУ ВНИЗ */
  #stats-row {
    flex: 1 1 auto;
    display: flex;
    gap: 4px;
    min-height: 0;
  }
  #history, #cold {
    flex: 1 1 0;
    background: #1a2130;
    border: 2px solid #2e3a4d;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 2px;
    padding: 4px;
    overflow-y: auto;
    overflow-x: hidden;
    cursor: pointer;
    transition: border-color .15s;
    min-height: 0;
    min-width: 0;
  }
  #history:active, #cold:active { border-color: #f0c040; }
  #history .title, #cold .title {
    flex: 0 0 auto;
    width: 100%;
    font-size: clamp(6px, 1.1vh, 9px);
    color: #7a8699;
    font-weight: 600;
    letter-spacing: .5px;
    pointer-events: none;
    text-align: center;
    margin-bottom: 2px;
  }

  /* Шарики статистики — на всю ширину, по центру 
  .hist-ball, .cold-ball {
    flex: 0 0 auto;
    width: 100%;
    height: clamp(16px, 3.2vh, 26px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.6vh, 12px);
    font-weight: 700;
    color: #fff;
  }
 
  .hist-ball.red,   .cold-ball.red   { background: #b3312a; }
  .hist-ball.black, .cold-ball.black { background: #1c2128; border: 1px solid #3a4553; }
  .hist-ball.green, .cold-ball.green { background: #1e8449; }
  .cold-ball { opacity: .85; }
 */

   /* Шарик на всю ширину — но для красных прижимаем влево, для чёрных вправо */
  .hist-ball, .cold-ball {
    flex: 0 0 auto;
    height: clamp(16px, 3.2vh, 26px);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(7px, 1.6vh, 12px);
    font-weight: 700;
    color: #fff;
    /* по умолчанию — во всю ширину */
    width: 100%;
    align-self: stretch;
  }

  /* КРАСНЫЕ — прижаты к левому краю колонки, круг по высоте */
  .hist-ball.red, .cold-ball.red {
    background: #b3312a;
    width: auto;
    aspect-ratio: 1;
    align-self: flex-start;
  }

  /* ЧЁРНЫЕ — прижаты к правому краю колонки */
  .hist-ball.black, .cold-ball.black {
    background: #1c2128;
    border: 1px solid #3a4553;
    width: auto;
    aspect-ratio: 1;
    align-self: flex-end;
  }

  /* ЗЕЛЁНЫЕ (0) — по центру, как было */
  .hist-ball.green, .cold-ball.green {
    background: #1e8449;
    width: auto;
    aspect-ratio: 1;
    align-self: center;
  }

  .cold-ball { opacity: .85; }

 

  /* Фишки — уменьшены в 1.8 раза */
  #chips {
    flex: 0 0 14%;               /* выше — 2 строки            flex: 0 0 22%;  */
    display: grid;
    grid-template-columns: repeat(3, 1fr);   /* 3 в ряд */
    grid-template-rows: repeat(2, 1fr);      /* 2 ряда */
    gap: 2px;
    align-items: center;
    justify-items: center;
    min-height: 0;
  }
  .chip {
    flex: 0 0 auto;
     
    aspect-ratio: 1;
    height: 80%;          /* или 80%, если нужен отступ */
    max-height: 80%;
     
    border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.5);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(6px, 1.2vh, 10px);
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    min-width: 0;
  }
  .chip[data-v="1"]   { background: #ecf0f1; color: #12161d; }
  .chip[data-v="5"]   { background: #c0392b; }
  .chip[data-v="25"]  { background: #27ae60; }
  .chip[data-v="100"] { background: #2c3e50; }
  .chip[data-v="500"] { background: #8e44ad; }
  .chip[data-v="2500"] { background: #c3cff4;color: #12161d; }
  .chip.selected { outline: 3px solid #f0c040; outline-offset: 1px; }

  /* Кнопка КРУТИТЬ — на всю ширину */
  #spin-btn {
    flex: 0 0 10%;
    border: 2px solid #c99a1e;
    border-radius: 6px;
    background: linear-gradient(180deg, #f0c040, #c99a1e);
    color: #12161d;
    font: inherit;
    font-size: clamp(8px, 1.7vh, 13px);
    font-weight: 800;
    cursor: pointer;
    white-space: nowrap;
    width: 100%;
  }
  #spin-btn:active { transform: scale(0.97); }
  #spin-btn:disabled { opacity: .5; cursor: wait; }

  /* Фишка-маркер выпавшего числа — опущена на 13px от центра */
  .cell.drop-marker { position: relative; }
  .cell.drop-marker::after {
    content: '';
    position: absolute;
    left: 50%;
    top: calc(50%);    /* top: calc(50% + 13px);  */
    transform: translate(-50%, -50%);
    width: 25px;
    height: 25px;
    background: url('tisch.png') center/contain no-repeat;
    pointer-events: none;
    z-index: 3;
  }
 
  /* Голубые ромбы вокруг КРАСН и ЧЁРН */
  #c1_red, #c1_blk {
    position: relative;
    overflow: visible;          /* чтобы ромб не обрезался */
  }
  #c1_red::before,
  #c1_blk::before {
    content: '';
    position: absolute;
    left: 50%; top: 50%;
    width: 26px; height: 26px;           /* размер ромба */
    border: 1px solid #5bc8e8;           /* голубая рамка 1px */
    background: transparent;
    transform: translate(-50%, -50%) rotate(45deg);
    pointer-events: none;                 /* не мешает кликам */
    z-index: 1;
  }


 
</style>
</head>
<body>
<div id="stage">
  <div id="inner">

    <!-- ВЕРХ: видео-баннер -->
    <div id="banner">
      <video id="banner-video" muted playsinline preload="auto"></video>
      <button id="sound-toggle" title="Звук">🔇</button>
    </div>

    <!-- НИЗ: две колонки -->
    <div id="main">

      <!-- ЛЕВАЯ: таблица рулетки -->
      <div id="left">
        <div id="numbers">

          <!-- Строка 1: баланс (кол.1-2) + 0 (кол.3-5) -->
          <div class="cell" id="r1c_balance" title="Нажми, чтобы изменить">
            <span class="lbl">$:</span>     <!-- вместо баланса $ -->
            <span class="val" id="balance-val">1000</span>
          </div>
          <div class="cell green" id="zero" data-bet="zero">0</div>

          <!-- Кол.1 -->
          <div class="cell outside" id="c1_118"  data-bet="range1_18">1-18</div>
          <div class="cell outside" id="c1_even" data-bet="even">ЧЁТ</div>
          <div class="cell outside red-bet" id="c1_red" data-bet="red">К</div>
          <div class="cell outside" id="c1_blk"  data-bet="black">Ч</div>
          <div class="cell outside" id="c1_odd"  data-bet="odd">НЕЧЁТ</div>
          <div class="cell outside" id="c1_1936" data-bet="range19_36">19-36</div>

          <!-- Кол.2 -->
          <div class="cell outside" id="c2_112"  data-bet="range1">1-12</div>
          <div class="cell outside" id="c2_1324" data-bet="range2">13-24</div>
          <div class="cell outside" id="c2_2536" data-bet="range3">25-36</div>

          <!-- Числа: строки 2-13, кол.3-5 (генерируются скриптом) -->

          <!-- Строка 14: × (очистка) + 2:1 -->
          <div id="clear-bets" title="Очистить все ставки">×</div>
          <div class="cell outside col-two-to-one" style="grid-column:3;" data-bet="col:1">2:1</div>
          <div class="cell outside col-two-to-one" style="grid-column:4;" data-bet="col:2">2:1</div>
          <div class="cell outside col-two-to-one" style="grid-column:5;" data-bet="col:3">2:1</div>

        </div>
      </div>

      <!-- ПРАВАЯ: результат+ввод, статистика, фишки, кнопка -->
      <div id="right">

        <div id="result-row">
          <div id="result">—</div>
          <div id="manual-wrap">
            <input id="manual" type="text" inputmode="numeric" placeholder="?">
            <button id="manual-clear" title="Очистить">×</button>
          </div>
        </div>

        <div id="stats-row">
          <div id="history"><span class="title">ПОСЛЕДНИЕ 12</span></div>
          <div id="cold"><span class="title">НЕ ВЫПАДАЛИ ≥15</span></div>
        </div>

        <div id="chips">
          <div class="chip" data-v="1">1</div>
          <div class="chip selected" data-v="5">5</div>
          <div class="chip" data-v="25">25</div>
          <div class="chip" data-v="100">100</div>
          <div class="chip" data-v="500">500</div>
          <div class="chip" data-v="2500">2500</div>
        </div>

        <button id="spin-btn">КРУТИТЬ</button>

      </div>
    </div>

  </div>
</div>

<script>
(function() {
  'use strict';

  const RED = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  const COLD_THRESHOLD = 15;
  const SPIN_TIMEOUT_MS = 5000;

  const state = {
    balance: 1000,
    selectedChip: 5,
    bets: {},
    spinning: false,
    history: [],
    spinCount: 0,
    lastSeen: {},
    coldNumbers: [],
  };

  const $ = (id) => document.getElementById(id);
  const resultEl = $('result');
  const manualEl = $('manual');
  const manualClear = $('manual-clear');
  const historyEl = $('history');
  const coldEl = $('cold');
  const balanceEl = $('r1c_balance');
  const numbersGrid = $('numbers');
  const bannerVideo = $('banner-video');
  const spinBtn = $('spin-btn');

  // ---------- Генерация чисел в сетке 5×14 ----------
  for (let row = 2; row <= 13; row++) {
    for (let col = 3; col <= 5; col++) {
      const n = (row - 2) * 3 + (col - 3 + 1);
      const el = document.createElement('div');
      el.className = 'cell ' + (RED.has(n) ? 'red' : 'black');
      el.textContent = n;
      el.dataset.bet = 'num:' + n;
      el.style.gridRow = row;
      el.style.gridColumn = col;
      numbersGrid.appendChild(el);
    }
  }

  // ---------- Баланс ----------
  function updateBalance() {
    const el = document.getElementById('balance-val');
    if (el) el.textContent = state.balance;
  }

  balanceEl.addEventListener('click', () => {
    if (state.spinning) return;
    if (balanceEl.querySelector('input')) return;

    const old = state.balance;
    const wrap = balanceEl;
    wrap.innerHTML = '';
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.inputMode = 'numeric';
    inp.value = old;
    wrap.appendChild(inp);
    inp.focus();
    inp.select();

    const commit = () => {
      let v = parseInt(inp.value.replace(/[^\d]/g, ''), 10);
      if (isNaN(v)) v = old;
      v = Math.max(0, Math.min(9999999, v));
      state.balance = v;
      wrap.innerHTML = '<span class="lbl">$:</span><span class="val" id="balance-val">' + v + '</span>';  // -- вместо Баланс: поставил $
    };
    inp.addEventListener('blur', commit, { once: true });
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { inp.blur(); }
      if (e.key === 'Escape') { inp.value = old; inp.blur(); }
    });
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/[^\d]/g, '').slice(0, 7);
    });
  });

  // ---------- История (новые СВЕРХУ, один на строку) ----------
  function addHistory(n) {
    state.history.unshift(n);
    if (state.history.length > 12) state.history.pop();
    renderHistory();
  }
  function renderHistory() {
    historyEl.innerHTML = '<span class="title">ПОСЛЕДНИЕ 12</span>';
    for (const n of state.history) {
      const b = document.createElement('div');
      b.className = 'hist-ball ' + colorOf(n);
      b.textContent = n;
      historyEl.appendChild(b);
    }
  }

  // ---------- Невыпавшие (новые СВЕРХУ, один на строку) ----------
  function updateCold(n) {
    state.spinCount++;
    state.lastSeen[n] = state.spinCount;
    const cold = [];
    for (let num = 0; num <= 36; num++) {
      const last = state.lastSeen[num] || 0;
      if (state.spinCount - last >= COLD_THRESHOLD) cold.push(num);
    }
    state.coldNumbers = cold;
    renderCold();
  }
  function renderCold() {
    coldEl.innerHTML = '<span class="title">НЕ ВЫПАДАЛИ ≥15</span>';
    for (const n of state.coldNumbers) {
      const b = document.createElement('div');
      b.className = 'cold-ball ' + colorOf(n);
      b.textContent = n;
      coldEl.appendChild(b);
    }
  }

  function colorOf(n) {
    if (n === 0) return 'green';
    return RED.has(n) ? 'red' : 'black';
  }

  // ---------- Ставки ----------
  function addBet(key, amount) {
    if (state.balance < amount) return false;
    state.balance -= amount;
    state.bets[key] = (state.bets[key] || 0) + amount;
    return true;
  }

  function placeBet(key) {
    if (state.spinning) return;
    clearDropMarker();
    if (addBet(key, state.selectedChip)) {
      updateBalance();
      renderBets();
    }
  }

  function clearBet(key) {
    if (state.spinning) return;
    const amount = state.bets[key] || 0;
    if (!amount) return;
    state.balance += amount;
    delete state.bets[key];
    updateBalance();
    renderBets();
  }

  function clearAllBets() {
    if (state.spinning) return;
    clearDropMarker();
    for (const amt of Object.values(state.bets)) {
      state.balance += amt;
    }
    state.bets = {};
    updateBalance();
    renderBets();
  }

  function renderBets() {
    document.querySelectorAll('.bet-mark').forEach(m => m.remove());
    document.querySelectorAll('[data-bet]').forEach(cell => {
      const key = cell.dataset.bet;
      const amt = state.bets[key];
      if (amt) {
        const m = document.createElement('div');
        m.className = 'bet-mark';
        m.textContent = amt;
        cell.appendChild(m);
      }
    });
  }

  // Клики по клеткам поля
  let longPressTimer = null;
  document.querySelectorAll('#numbers [data-bet]').forEach(cell => {
    cell.addEventListener('click', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; return; }
      placeBet(cell.dataset.bet);
    });
    cell.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      clearBet(cell.dataset.bet);
    });
    cell.addEventListener('touchstart', () => {
      longPressTimer = setTimeout(() => {
        clearBet(cell.dataset.bet);
        longPressTimer = null;
      }, 500);
    }, { passive: true });
    cell.addEventListener('touchend', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    });
    cell.addEventListener('touchmove', () => {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }, { passive: true });
  });

  // ---------- Клик по статистике ----------
  historyEl.addEventListener('click', () => {
    if (state.spinning) return;
    for (const n of state.history.slice(0, 12)) {
      addBet(n === 0 ? 'zero' : 'num:' + n, 1);
    }
    updateBalance();
    renderBets();
  });

  coldEl.addEventListener('click', () => {
    if (state.spinning) return;
    for (const n of state.coldNumbers) {
      addBet(n === 0 ? 'zero' : 'num:' + n, 1);
    }
    updateBalance();
    renderBets();
  });

  // ---------- Фишки ----------
  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
      chip.classList.add('selected');
      state.selectedChip = parseInt(chip.dataset.v, 10);
    });
  });

  // ---------- Очистка ставок ----------
  $('clear-bets').addEventListener('click', clearAllBets);

  // ---------- Ручной ввод ----------
  function getManualValue() {
    const raw = manualEl.value.trim();
    if (raw === '') return null;
    const n = parseInt(raw, 10);
    if (isNaN(n) || n < 0 || n > 36) return null;
    return n;
  }
  function updateManualClear() {
    manualClear.classList.toggle('visible', manualEl.value.trim() !== '');
  }
  manualEl.addEventListener('input', () => {
    manualEl.value = manualEl.value.replace(/[^\d]/g, '').slice(0, 2);
    updateManualClear();
  });
  manualClear.addEventListener('click', (e) => {
    e.stopPropagation();
    manualEl.value = '';
    updateManualClear();
  });

  // ---------- Расчёт выигрыша ----------
  function calcWinnings(n) {
    let win = 0;
    const isRed = RED.has(n);
    const isBlack = n !== 0 && !isRed;

    for (const [key, amount] of Object.entries(state.bets)) {
      if (key.startsWith('num:')) {
        if (parseInt(key.slice(4), 10) === n) win += amount * 36;
      } else if (key === 'zero') {
        if (n === 0) win += amount * 36;
      } else if (key === 'red') {
        if (isRed) win += amount * 2;
      } else if (key === 'black') {
        if (isBlack) win += amount * 2;
      } else if (key === 'even') {
        if (n !== 0 && n % 2 === 0) win += amount * 2;
      } else if (key === 'odd') {
        if (n !== 0 && n % 2 === 1) win += amount * 2;
      } else if (key === 'range1') {
        if (n >= 1 && n <= 12) win += amount * 3;
      } else if (key === 'range2') {
        if (n >= 13 && n <= 24) win += amount * 3;
      } else if (key === 'range3') {
        if (n >= 25 && n <= 36) win += amount * 3;
      } else if (key === 'range1_18') {
        if (n >= 1 && n <= 18) win += amount * 2;
      } else if (key === 'range19_36') {
        if (n >= 19 && n <= 36) win += amount * 2;
      } else if (key.startsWith('col:')) {
        const col = parseInt(key.slice(4), 10);
        const actualCol = n === 0 ? 0 : ((n - 1) % 3 + 1);
        if (actualCol === col) win += amount * 3;
      }
    }
    return win;
  }

  // ---------- Видео-баннер ----------
  function videoFileForNumber(n) {
    const two = String(n).padStart(2, '0');
    return 'f' + two + '0.mp4';
  }

  let soundOn = localStorage.getItem('roulette_sound') === '1';
  const soundToggle = $('sound-toggle');

  function applySoundState() {
    bannerVideo.muted = !soundOn;
    soundToggle.textContent = soundOn ? '🔊' : '🔇';
  }
  applySoundState();

  soundToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    soundOn = !soundOn;
    localStorage.setItem('roulette_sound', soundOn ? '1' : '0');
    applySoundState();
  });

  bannerVideo.src = videoFileForNumber(0);
  bannerVideo.load();

  // ---------- Маркер выпавшего числа ----------
  function clearDropMarker() {
    document.querySelectorAll('#numbers .cell.drop-marker').forEach(c => c.classList.remove('drop-marker'));
  }
  function showDropMarker(n) {
    clearDropMarker();
    const key = n === 0 ? 'zero' : 'num:' + n;
    const cell = document.querySelector('#numbers [data-bet="' + key + '"]');
    if (cell) cell.classList.add('drop-marker');
  }

  // ---------- Кручение ----------
  let spinFinishTimer = null;
  let pendingNumber = null;

  function playBannerVideo(n) {
    bannerVideo.pause();
    bannerVideo.src = videoFileForNumber(n);
    bannerVideo.currentTime = 0;
    bannerVideo.muted = !soundOn;
    const p = bannerVideo.play();
    if (p && typeof p.catch === 'function') {
      p.catch(() => {});
    }
  }

  function spinSafe() {
    if (state.spinning) return;
    clearDropMarker();

    const manualVal = getManualValue();
    const finalN = manualVal !== null ? manualVal : Math.floor(Math.random() * 37);
    pendingNumber = finalN;

    state.spinning = true;
    spinBtn.disabled = true;
    resultEl.classList.add('busy', 'spinning');
    resultEl.classList.remove('red', 'black', 'green');
    resultEl.textContent = '…';

    playBannerVideo(finalN);

    spinFinishTimer = setTimeout(() => {
      if (pendingNumber !== null) finishSpin(pendingNumber);
    }, SPIN_TIMEOUT_MS);
  }

  function finishSpin(n) {
    if (!state.spinning) return;
    if (spinFinishTimer) { clearTimeout(spinFinishTimer); spinFinishTimer = null; }

    pendingNumber = null;

    resultEl.textContent = n;
    resultEl.classList.remove('red', 'black', 'green', 'busy', 'spinning');
    resultEl.classList.add(colorOf(n));

    addHistory(n);
    updateCold(n);

    const win = calcWinnings(n);
    state.balance += win;

    state.bets = {};
    renderBets();
    updateBalance();

    highlightWinners(n);
    showDropMarker(n);

    state.spinning = false;
    spinBtn.disabled = false;
  }

  bannerVideo.addEventListener('ended', () => {
    if (state.spinning && pendingNumber !== null) {
      if (spinFinishTimer) { clearTimeout(spinFinishTimer); spinFinishTimer = null; }
      finishSpin(pendingNumber);
    }
  });

  function highlightWinners(n) {
    const winners = [];
    document.querySelectorAll('#numbers [data-bet]').forEach(cell => {
      const key = cell.dataset.bet;
      let hit = false;
      if (key === 'num:' + n) hit = true;
      if (key === 'zero' && n === 0) hit = true;
      if (key === 'red' && RED.has(n)) hit = true;
      if (key === 'black' && n !== 0 && !RED.has(n)) hit = true;
      if (key === 'even' && n !== 0 && n % 2 === 0) hit = true;
      if (key === 'odd' && n !== 0 && n % 2 === 1) hit = true;
      if (key === 'range1' && n >= 1 && n <= 12) hit = true;
      if (key === 'range2' && n >= 13 && n <= 24) hit = true;
      if (key === 'range3' && n >= 25 && n <= 36) hit = true;
      if (key === 'range1_18' && n >= 1 && n <= 18) hit = true;
      if (key === 'range19_36' && n >= 19 && n <= 36) hit = true;
      if (key.startsWith('col:') && n !== 0 && ((n - 1) % 3 + 1) === parseInt(key.slice(4), 10)) hit = true;
      if (hit) { cell.classList.add('hit'); winners.push(cell); }
    });
    setTimeout(() => winners.forEach(c => c.classList.remove('hit')), 800);
  }

  spinBtn.addEventListener('click', spinSafe);

  // Инициализация
  updateBalance();
  updateManualClear();
  renderHistory();
  renderCold();
  renderBets();
})();
</script>
</body>
</html>
