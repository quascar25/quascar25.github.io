 <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230d1b2a' stroke='%234a8aba' stroke-width='3'/><text x='50' y='72' font-size='50' text-anchor='middle' fill='%238ab8e8'>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⭐VPN КОНТРОЛЬ⭐</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: radial-gradient(ellipse at bottom, #0d1b2a 0%, #020617 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; position: relative; overflow: hidden; }
        body::before { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-image: radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #eee, rgba(0,0,0,0)), radial-gradient(2px 2px at 50px 160px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 160px 30px, #eee, rgba(0,0,0,0)), radial-gradient(1px 1px at 300px 200px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 400px 100px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 500px 300px, #fff, rgba(0,0,0,0)), radial-gradient(1px 1px at 600px 50px, #fff, rgba(0,0,0,0)); background-size: 200px 200px; background-repeat: repeat; opacity: 0.4; pointer-events: none; animation: twinkle 4s ease-in-out infinite alternate; }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.7; } }

        /* КОНТЕЙНЕР — все размеры уменьшены в 2 раза */
        .container { background: linear-gradient(145deg, #1a2940 0%, #0f1a2e 100%); border: 1px solid #2a4a6a; border-radius: 12px; padding: 20px; max-width: 260px; width: 100%; box-shadow: 0 0 15px rgba(0, 100, 255, 0.15), inset 0 0 30px rgba(0, 50, 150, 0.1), 0 10px 30px rgba(0, 0, 0, 0.8); position: relative; backdrop-filter: blur(5px); }
        .container::before { content: '◆'; position: absolute; top: -4px; left: 10px; color: #4a8aba; font-size: 8px; text-shadow: 0 0 5px rgba(74, 138, 186, 0.5); }
        .container::after { content: '◆'; position: absolute; bottom: -4px; right: 10px; color: #4a8aba; font-size: 8px; text-shadow: 0 0 5px rgba(74, 138, 186, 0.5); }

        h1 { font-size: 16px; color: #8ab8e8; margin-bottom: 3px; text-align: center; text-shadow: 0 0 10px rgba(74, 138, 186, 0.3); letter-spacing: 2px; font-weight: 400; text-transform: uppercase; }
        h1 span { color: #ffd700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
        .subtitle { text-align: center; color: #5a7a9a; margin-bottom: 12px; font-size: 9px; letter-spacing: 1px; font-weight: 300; border-bottom: 1px solid rgba(74, 138, 186, 0.15); padding-bottom: 6px; }

        .status-box { border: 1px solid #2a4a6a; border-radius: 8px; padding: 10px; text-align: center; margin-bottom: 10px; background: rgba(20, 40, 70, 0.3); transition: all 0.4s ease; }
        .status-box.online { border-color: #4a8aba; box-shadow: 0 0 15px rgba(74, 138, 186, 0.1); }
        .status-box.offline { border-color: #6a3a3a; box-shadow: 0 0 15px rgba(186, 74, 74, 0.1); }
        .status-icon { font-size: 20px; margin-bottom: 2px; filter: drop-shadow(0 0 10px rgba(74, 138, 186, 0.3)); }
        .status-text { font-size: 12px; color: #8ab8e8; letter-spacing: 1px; }
        .status-text.online { color: #4caf7a; }
        .status-text.offline { color: #ef5350; }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0; }
        .info-card { background: rgba(10, 20, 40, 0.3); border: 1px solid #1a3a5a; border-radius: 6px; padding: 6px 4px; text-align: center; transition: all 0.3s; }
        .info-card:hover { border-color: #2a5a7a; transform: translateY(-1px); box-shadow: 0 2px 10px rgba(0, 50, 100, 0.2); }
        .info-label { color: #5a7a9a; font-size: 7px; letter-spacing: 0.5px; text-transform: uppercase; }
        .info-value { color: #8ab8e8; font-size: 12px; margin-top: 2px; font-weight: bold; letter-spacing: 0.5px; }
        .info-value.green { color: #4caf7a; }
        .info-value.red { color: #ef5350; }
        .info-value.gold { color: #ffd700; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
        .vpn-btn { padding: 6px 0; background: linear-gradient(180deg, #1a3a5a 0%, #0a1a30 100%); color: #8ab8e8; border: 1px solid #2a5a7a; border-radius: 8px; font-size: 10px; font-weight: 400; cursor: pointer; transition: all 0.2s ease; font-family: 'Courier New', monospace; letter-spacing: 1px; text-transform: uppercase; position: relative; box-shadow: 0 3px 0 #0a1520, 0 4px 10px rgba(0, 0, 0, 0.5); }
        .vpn-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #0a1520, 0 4px 10px rgba(0, 0, 0, 0.5); }
        .vpn-btn:hover:not(:disabled) { background: linear-gradient(180deg, #2a4a6a 0%, #0a1a30 100%); border-color: #4a8aba; box-shadow: 0 3px 0 #0a1520, 0 0 20px rgba(74, 138, 186, 0.2); color: #aac8e8; }
        .vpn-btn.connect { border-color: #2a6a4a; color: #4caf7a; }
        .vpn-btn.connect:hover { border-color: #4caf7a; box-shadow: 0 3px 0 #0a1520, 0 0 20px rgba(76, 175, 122, 0.2); }
        .vpn-btn.disconnect { border-color: #6a3a3a; color: #ef5350; }
        .vpn-btn.disconnect:hover { border-color: #ef5350; box-shadow: 0 3px 0 #0a1520, 0 0 20px rgba(239, 83, 80, 0.2); }
        .vpn-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: translateY(2px); box-shadow: 0 1px 0 #0a1520; }

        .clients-section { margin: 8px 0; border: 1px solid #1a3a5a; border-radius: 6px; padding: 6px 8px; background: rgba(10, 20, 40, 0.3); }
        .clients-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .clients-header span { color: #6a9aba; font-size: 8px; letter-spacing: 1px; text-transform: uppercase; }
        .clients-header .vpn-btn { padding: 2px 8px; font-size: 8px; box-shadow: 0 2px 0 #0a1520; border-radius: 4px; letter-spacing: 0.5px; }
        .client-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; border-bottom: 1px solid rgba(26, 58, 90, 0.3); }
        .client-item:last-child { border-bottom: none; }
        .client-name { color: #8ab8e8; font-size: 9px; letter-spacing: 0.5px; }
        .client-status { font-size: 8px; padding: 1px 8px; border-radius: 10px; background: rgba(76, 175, 122, 0.15); color: #4caf7a; border: 1px solid rgba(76, 175, 122, 0.2); }
        .client-status.off { background: rgba(239, 83, 80, 0.1); color: #ef5350; border-color: rgba(239, 83, 80, 0.2); }

        .qr-btn { width: 100%; padding: 5px 0; font-size: 9px; letter-spacing: 1px; box-shadow: 0 2px 0 #0a1520; border-radius: 6px; margin-top: 4px; }
        .qr-box { margin-top: 6px; padding: 10px; background: rgba(0, 0, 0, 0.3); border-radius: 6px; border: 1px dashed #2a4a6a; text-align: center; display: none; }
        .qr-box.visible { display: block; }
        .qr-box .qr-placeholder { font-size: 9px; color: #5a7a9a; letter-spacing: 1px; font-family: 'Courier New', monospace; }
        .qr-box .qr-placeholder span { display: block; font-size: 28px; margin-bottom: 4px; filter: drop-shadow(0 0 15px rgba(74, 138, 186, 0.2)); }

        .progress-section { margin-top: 6px; display: none; }
        .progress-section.active { display: block; }
        .progress-bar-bg { width: 100%; height: 4px; background: #0a1a2a; border-radius: 2px; overflow: hidden; margin-top: 4px; border: 1px solid #1a3a5a; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #2a6a9a, #4a8aba, #6aaada); width: 0%; transition: width 0.3s ease; border-radius: 2px; box-shadow: 0 0 10px rgba(74, 138, 186, 0.3); }
        .progress-text { display: flex; justify-content: space-between; font-size: 8px; color: #5a7a9a; margin-top: 3px; font-family: 'Courier New', monospace; }

        .status-message { text-align: center; color: #6a8aaa; font-size: 9px; margin-top: 6px; letter-spacing: 0.5px; }
        .error-message { color: #ff4466; text-align: center; margin-top: 6px; font-size: 9px; font-family: 'Courier New', monospace; text-shadow: 0 0 10px rgba(255, 68, 102, 0.2); }

        @media (max-width: 320px) { .container { padding: 12px; max-width: 220px; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 <span>VPN</span>КОНТРОЛЬ</h1>
        <div class="subtitle">⚡ УПРАВЛЕНИЕ WIREGUARD ⚡</div>

        <div class="status-box online" id="statusBox">
            <div class="status-icon" id="statusIcon">🛡️</div>
            <div class="status-text online" id="statusText">● ПОДКЛЮЧЕН</div>
        </div>

        <div class="info-grid">
            <div class="info-card"><div class="info-label">🌐 IP</div><div class="info-value" id="serverIp">138.124.18.178</div></div>
            <div class="info-card"><div class="info-label">📶 ТРАФИК</div><div class="info-value gold" id="traffic">0.0 ГБ</div></div>
            <div class="info-card"><div class="info-label">👥 КЛИЕНТЫ</div><div class="info-value" id="clientsCount">2</div></div>
            <div class="info-card"><div class="info-label">⚡ СКОРОСТЬ</div><div class="info-value green" id="speed">0 Mbps</div></div>
        </div>

        <div class="btn-group">
            <button class="vpn-btn connect" id="connectBtn">▶ ПОДКЛ.</button>
            <button class="vpn-btn disconnect" id="disconnectBtn">⏹ ОТКЛ.</button>
        </div>

        <div class="clients-section">
            <div class="clients-header">
                <span>👥 КЛИЕНТЫ</span>
                <button class="vpn-btn" style="padding:2px 6px; font-size:7px; box-shadow:0 2px 0 #0a1520; border-radius:4px; letter-spacing:0.5px;">+</button>
            </div>
            <div class="client-item"><span class="client-name">📱 iPhone</span><span class="client-status">● АКТИВЕН</span></div>
            <div class="client-item"><span class="client-name">💻 Ноутбук</span><span class="client-status">● АКТИВЕН</span></div>
            <div class="client-item"><span class="client-name">🖥 Рабочий ПК</span><span class="client-status off">○ ОТКЛ.</span></div>
        </div>

        <button class="vpn-btn qr-btn" id="showQrBtn">📲 QR</button>
        <div class="qr-box" id="qrBox">
            <div class="qr-placeholder"><span>⬛⬛⬛⬛⬛⬛⬛⬛⬛</span>⬛ QR-код ⬛<br>⬛⬛⬛⬛⬛⬛⬛⬛⬛</div>
        </div>

        <div class="progress-section" id="progressSection">
            <div class="progress-bar-bg"><div class="progress-bar" id="progressBar"></div></div>
            <div class="progress-text"><span id="progressPercent">0%</span><span id="progressTime">...</span></div>
            <div class="status-message" id="statusMessage">⏳ ГОТОВ</div>
        </div>
        <div class="error-message" id="errorMessage"></div>
    </div>

    <script>
        const statusBox = document.getElementById('statusBox');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const showQrBtn = document.getElementById('showQrBtn');
        const qrBox = document.getElementById('qrBox');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressTime = document.getElementById('progressTime');
        const statusMessage = document.getElementById('statusMessage');
        const errorMessage = document.getElementById('errorMessage');
        const trafficEl = document.getElementById('traffic');
        const speedEl = document.getElementById('speed');
        const clientsCountEl = document.getElementById('clientsCount');

        let isConnected = false;
        let traffic = 0;
        let intervalId = null;

        function updateTraffic() {
            if (isConnected) {
                traffic += (Math.random() * 0.05 + 0.02);
                trafficEl.textContent = traffic.toFixed(1) + ' ГБ';
                const speed = (Math.random() * 8 + 2).toFixed(1);
                speedEl.textContent = speed + ' Mbps';
                speedEl.className = 'info-value green';
            } else {
                speedEl.textContent = '0 Mbps';
                speedEl.className = 'info-value red';
            }
        }

        function connectVPN() {
            if (isConnected) return;
            statusMessage.textContent = '⏳ ПОДКЛЮЧЕНИЕ...';
            progressSection.classList.add('active');
            progressBar.style.width = '0%';
            progressPercent.textContent = '0%';
            progressTime.textContent = '...';
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 8 + 2;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    isConnected = true;
                    statusBox.className = 'status-box online';
                    statusIcon.textContent = '🛡️';
                    statusText.textContent = '● ПОДКЛЮЧЕН';
                    statusText.className = 'status-text online';
                    progressBar.style.width = '100%';
                    progressPercent.textContent = '100%';
                    progressTime.textContent = '✅ ГОТОВО';
                    statusMessage.textContent = '✅ VPN АКТИВЕН';
                    errorMessage.textContent = '';
                    setTimeout(() => progressSection.classList.remove('active'), 1000);
                    if (intervalId) clearInterval(intervalId);
                    intervalId = setInterval(updateTraffic, 1000);
                }
                progressBar.style.width = progress + '%';
                progressPercent.textContent = Math.round(progress) + '%';
                progressTime.textContent = Math.round(progress) + '%';
            }, 120);
        }

        function disconnectVPN() {
            if (!isConnected) return;
            isConnected = false;
            statusBox.className = 'status-box offline';
            statusIcon.textContent = '⛔';
            statusText.textContent = '● ОТКЛЮЧЕН';
            statusText.className = 'status-text offline';
            if (intervalId) { clearInterval(intervalId); intervalId = null; }
            trafficEl.textContent = traffic.toFixed(1) + ' ГБ';
            speedEl.textContent = '0 Mbps';
            speedEl.className = 'info-value red';
            statusMessage.textContent = '⏹ VPN ОТКЛЮЧЕН';
            errorMessage.textContent = '';
            progressSection.classList.add('active');
            progressBar.style.width = '100%';
            progressPercent.textContent = '100%';
            progressTime.textContent = '⏹ ОТКЛЮЧЕНО';
            setTimeout(() => progressSection.classList.remove('active'), 800);
        }

        showQrBtn.addEventListener('click', () => qrBox.classList.toggle('visible'));
        connectBtn.addEventListener('click', connectVPN);
        disconnectBtn.addEventListener('click', disconnectVPN);

        let clientsStatus = [true, true, false];
        setInterval(() => {
            if (isConnected) {
                const idx = Math.floor(Math.random() * 3);
                clientsStatus[idx] = !clientsStatus[idx];
                document.querySelectorAll('.client-item').forEach((item, i) => {
                    const el = item.querySelector('.client-status');
                    if (clientsStatus[i]) { el.textContent = '● АКТИВЕН'; el.className = 'client-status'; } 
                    else { el.textContent = '○ ОТКЛ.'; el.className = 'client-status off'; }
                });
                clientsCountEl.textContent = clientsStatus.filter(s => s).length;
            }
        }, 4000);

        statusMessage.textContent = '⏳ ГОТОВ';
        speedEl.textContent = '0 Mbps';
        speedEl.className = 'info-value red';
        clientsCountEl.textContent = clientsStatus.filter(s => s).length;
    </script>
</body>
</html>
