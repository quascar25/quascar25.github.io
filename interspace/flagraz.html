<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Развивающийся флаг</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1e2637;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: sans-serif;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    cursor: pointer;
    background: #1e2637;
  }
</style>
</head>
<body>

<canvas id="flag" width="50" height="30"></canvas>

<script>
const canvas = document.getElementById('flag');
const ctx = canvas.getContext('2d');
const W = canvas.width;   // 50
const H = canvas.height;  // 30

// Вытягиваем ImageData один раз — потом просто перезаписываем пиксели
let img = ctx.createImageData(W, H);
let buf = img.data;

// Фон — тёмно-сине-серый
const BG = { r: 30, g: 38, b: 55 };
// Цвет флага — красный
const FLAG = { r: 200, g: 20, b: 30 };

let animating = true;
let startTime = performance.now();
let frozenPhase = 0;
let phase = 0;

function drawFlag(t) {
  // Фаза анимации (в секундах)
  phase = t;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const idx = (y * W + x) * 4;

      // Полотно флага: занимает, скажем, область с отступом 3px по краям
      const fx0 = 3, fx1 = W - 4;   // [3..46]
      const fy0 = 4, fy1 = H - 5;   // [4..25]

      // Нормализованные координаты внутри полотна
      const nx = (x - fx0) / (fx1 - fx0); // 0..1 слева направо
      const ny = (y - fy0) / (fy1 - fy0); // 0..1 сверху вниз

      // Насколько "внутри" полотна (плавные края, чтобы не было рваных пикселей)
      const insideX = Math.min(nx, 1 - nx);
      const insideY = Math.min(ny, 1 - ny);
      const edge = Math.min(insideX, insideY);

      let isFlag = false;
      if (nx >= 0 && nx <= 1 && ny >= 0 && ny <= 1) {
        // Волна смещает полотно по вертикали в зависимости от X и времени
        const wave1 = Math.sin(nx * Math.PI * 3 + phase * 4) * 1.6;
        const wave2 = Math.sin(nx * Math.PI * 6 - phase * 2.5) * 0.7;
        const offset = wave1 + wave2;

        // Слегка сужаем полотно у правого края (эффект развевания)
        const taper = 1 - 0.25 * nx;

        // Проверяем, попадает ли пиксель в деформированное полотно
        const centerY = (fy0 + fy1) / 2 + offset;
        const halfH = ((fy1 - fy0) / 2) * taper;
        if (y >= centerY - halfH && y <= centerY + halfH) {
          isFlag = true;
        }
      }

      let r, g, b;

      if (isFlag) {
        // Красный с лёгким затемнением по краям и по волнам (объём)
        const shade =
          0.75 +
          0.25 * Math.sin(nx * Math.PI * 4 + phase * 5) +
          0.15 * (1 - edge);
        const s = Math.max(0.45, Math.min(1.15, shade));
        r = Math.min(255, FLAG.r * s);
        g = FLAG.g * s * 0.6;
        b = FLAG.b * s * 0.7;
      } else {
        // Фон: тёмно-сине-серый с лёгким градиентом
        const v = 0.85 + 0.15 * (1 - y / H);
        r = BG.r * v;
        g = BG.g * v;
        b = BG.b * v;
      }

      buf[idx]     = r;
      buf[idx + 1] = g;
      buf[idx + 2] = b;
      buf[idx + 3] = 255;
    }
  }

  ctx.putImageData(img, 0, 0);
}

function loop(now) {
  if (animating) {
    const t = (now - startTime) / 1000 + frozenPhase;
    drawFlag(t);
  }
  requestAnimationFrame(loop);
}

// Клик по флагу — пауза / возобновление
canvas.addEventListener('click', () => {
  if (animating) {
    // Останавливаем: запоминаем текущую фазу
    frozenPhase = phase;
    animating = false;
  } else {
    // Возобновляем: сбрасываем startTime, чтобы фаза продолжилась
    startTime = performance.now();
    animating = true;
  }
});

requestAnimationFrame(loop);
</script>

</body>
</html>
