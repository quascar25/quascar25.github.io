<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ГЕЛИОС-7 · Борткомпьютер</title>
<style>
  :root{
    --bg-0:#050912; --bg-1:#0a1220; --bg-2:#0f1a2c;
    --line:#1c3a5a; --neon:#3aa9ff; --neon-2:#00ffe0;
    --warn:#ff7a3a; --ok:#7cff9b; --red:#ff4a5a;
    --text:#c7d7ea; --text-dim:#6c86a3;
    --glow: 0 0 8px rgba(58,169,255,.7), 0 0 20px rgba(58,169,255,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{
    font-family:"Consolas","Courier New",monospace;
    color:var(--text);
    background:
      radial-gradient(circle at 20% 10%, rgba(58,169,255,.10), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(0,255,224,.08), transparent 45%),
      radial-gradient(circle at 50% 50%, #0a1426 0%, #050912 70%);
    min-height:100vh;overflow-x:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background-image:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 70% 15%, #bcd8ff, transparent),
      radial-gradient(1px 1px at 40% 80%, #fff, transparent),
      radial-gradient(1px 1px at 85% 60%, #9fd0ff, transparent),
      radial-gradient(1px 1px at 10% 70%, #fff, transparent),
      radial-gradient(1px 1px at 55% 45%, #fff, transparent),
      radial-gradient(1px 1px at 30% 55%, #8ec8ff, transparent);
    opacity:.6;pointer-events:none;
    animation: twinkle 6s infinite alternate ease-in-out;
  }
  @keyframes twinkle{from{opacity:.35}to{opacity:.8}}

  .terminal{width:100%;max-width:760px;position:relative;z-index:1}

  .term-header{
    display:flex;align-items:center;gap:12px;
    padding:12px 18px;border:1px solid var(--line);border-bottom:none;
    background:linear-gradient(180deg, rgba(15,26,44,.95), rgba(10,18,32,.85));
    clip-path: polygon(0 0, calc(100% - 20px) 0, 100% 20px, 100% 100%, 0 100%);
    position:relative;
  }
  .term-header::after{
    content:"";position:absolute;left:18px;right:18px;bottom:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--neon),transparent);opacity:.5;
  }
  .term-header .mark{
    width:20px;height:20px;
    background:linear-gradient(135deg,var(--neon),var(--neon-2));
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
    box-shadow:var(--glow);
    animation: pulse 2.5s infinite ease-in-out;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .term-header .title{
    font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#bcd8ff;
  }
  .term-header .title b{color:#eaf6ff;font-weight:600}
  .term-header .status{
    margin-left:auto;display:flex;align-items:center;gap:8px;
    font-size:10px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;
  }
  .term-header .status .led{
    width:6px;height:6px;border-radius:50%;
    background:var(--neon);box-shadow:0 0 10px var(--neon);
    animation: blink 1.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}

  .ai-window{
    border:1px solid var(--line);
    background:rgba(3,8,16,.94);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
    box-shadow: inset 0 0 30px rgba(58,169,255,.08), 0 20px 50px rgba(0,0,0,.6);
    position:relative;overflow:hidden;
    transition: box-shadow .4s, border-color .4s;
  }
  .ai-window.alert{
    border-color:var(--red);
    box-shadow: inset 0 0 24px rgba(255,74,90,.25), 0 0 30px rgba(255,74,90,.4);
  }
  .ai-window::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--neon-2), transparent);opacity:.8;
  }

  .ai-header{
    display:flex;align-items:center;gap:10px;
    padding:10px 18px;border-bottom:1px solid var(--line);
    font-size:10px;letter-spacing:3px;text-transform:uppercase;
    color:#8ec8ff;background:linear-gradient(90deg, rgba(58,169,255,.06), transparent);
    position:relative;
  }
  .ai-header .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--neon);box-shadow:0 0 8px var(--neon);
    animation: blink 1.4s infinite;
  }
  .ai-header .pulse{
    margin-left:auto;width:6px;height:6px;border-radius:50%;
    background:var(--neon);box-shadow:0 0 10px var(--neon);
    animation: aiBlink 1s infinite;
  }
  @keyframes aiBlink{0%,100%{opacity:1}50%{opacity:.15}}

  .ai-window.thinking .ai-header{
    color:#eaf6ff;text-shadow:0 0 8px var(--neon);
    animation: aiFlicker .35s alternate infinite;
  }
  .ai-window.thinking .pulse{
    background:var(--neon-2);box-shadow:0 0 14px var(--neon-2);
    animation-duration:.25s;
  }
  @keyframes aiFlicker{
    from{ background:linear-gradient(90deg, rgba(58,169,255,.15), transparent); }
    to  { background:linear-gradient(90deg, rgba(0,255,224,.15), transparent); }
  }

  .ai-body{
    height:min(58vh, 480px);overflow-y:auto;
    padding:18px 22px;font-size:12px;letter-spacing:1px;line-height:1.7;
    color:#bcd8ff;scroll-behavior:smooth;
  }
  .ai-body::-webkit-scrollbar{width:6px}
  .ai-body::-webkit-scrollbar-thumb{background:var(--line)}

  .ai-msg{
    margin-bottom:10px;opacity:0;transform:translateY(4px);
    animation: msgIn .35s forwards;max-width:92%;
  }
  @keyframes msgIn{to{opacity:1;transform:translateY(0)}}

  .ai-msg.user{margin-left:auto;text-align:right;color:#ffcfb8}
  .ai-msg.user::before{content:"▸ КАПИТАН: ";color:var(--warn);letter-spacing:2px}

  .ai-msg.bot{color:#eaf6ff;text-shadow:0 0 6px rgba(58,169,255,.45)}
  .ai-msg.bot::before{content:"▸ БОРТ: ";color:var(--neon-2);letter-spacing:2px}

  .ai-msg.bot.think{color:#8ec8ff;font-style:italic;opacity:.9;text-shadow:none}
  .ai-msg.bot.think::before{content:"▸ БОРТ · ";color:#4a88c4}

  .typing{display:inline-block}
  .typing::after{content:"·";animation: dots 1.2s steps(4, end) infinite}
  @keyframes dots{
    0%{content:""} 25%{content:"·"} 50%{content:"··"}
    75%{content:"···"} 100%{content:""}
  }

  .ai-input-row{
    display:flex;gap:0;border-top:1px solid var(--line);
    background:rgba(5,10,20,.95);position:relative;
  }
  .ai-input-row::before{
    content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(58,169,255,.5),transparent);
  }
  .ai-input-row input{
    flex:1;background:transparent;border:none;outline:none;
    padding:16px 18px;color:#eaf6ff;font-family:inherit;
    font-size:12px;letter-spacing:2px;
  }
  .ai-input-row input::placeholder{color:#4a6484}

  .btn{
    position:relative;padding:16px 26px;
    font-family:inherit;font-size:11px;letter-spacing:3px;
    text-transform:uppercase;color:#bcd8ff;
    background:linear-gradient(180deg, rgba(15,26,44,.9), rgba(8,14,26,.9));
    border:none;border-left:1px solid var(--line);
    cursor:pointer;transition: all .25s ease;overflow:hidden;
  }
  .btn::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(120deg, transparent 30%, rgba(58,169,255,.25) 50%, transparent 70%);
    transform: translateX(-120%);transition: transform .6s;
  }
  .btn:hover{
    color:#eaf6ff;
    background:linear-gradient(180deg, rgba(0,255,224,.10), rgba(58,169,255,.06));
    text-shadow: 0 0 8px var(--neon);
    box-shadow: inset 0 0 20px rgba(58,169,255,.15);
  }
  .btn:hover::after{transform:translateX(120%)}
  .btn:active{transform: translateY(1px)}

  .term-footer{
    display:flex;justify-content:space-between;
    padding:10px 18px;font-size:10px;letter-spacing:3px;
    color:var(--text-dim);text-transform:uppercase;
    border:1px solid var(--line);border-top:none;
    background:rgba(5,10,20,.6);
    clip-path: polygon(0 0, 100% 0, 100% 100%, 20px 100%, 0 calc(100% - 20px));
  }

  /* ===== ОТПЕЧАТОК МЫСЛИ ===== */
  .thought-box{
    width:30px;height:30px;
    margin-left:14px;
    border:1px solid var(--line);
    background:#02060d;
    position:relative;
    box-shadow: inset 0 0 6px rgba(58,169,255,.3);
    flex-shrink:0;
    transition: box-shadow .3s;
  }
  .thought-box::before{
    content:"";
    position:absolute;inset:0;
    border:1px solid rgba(58,169,255,.25);
    pointer-events:none;
  }
  .thought-box.thinking{
    box-shadow: inset 0 0 10px rgba(0,255,224,.5), 0 0 8px rgba(0,255,224,.35);
  }
  .thought-box canvas{
    display:block;
    image-rendering: pixelated;
  }
</style>
</head>
<body>

<div class="terminal">
  <div class="term-header">
    <div class="mark"></div>
    <div class="title">ГЕЛИОС‑7 · <b>БОРТКОМПЬЮТЕР</b></div>
    <div class="status">
      <span class="led"></span>
      <span id="statusText">ЗАГРУЗКА ЯДРА</span>
    </div>
  </div>

  <div class="ai-window" id="aiWindow">
    <div class="ai-header">
      <span class="dot"></span>
      <span id="aiStatus">ИИ · ИНИЦИАЛИЗАЦИЯ</span>
      <div class="thought-box" id="thoughtBox">
        <canvas id="aiThought" width="30" height="30"></canvas>
      </div>
      <span class="pulse"></span>
    </div>

    <div class="ai-body" id="aiBody">
      <div class="ai-msg bot">Загрузка лингвистического ядра...</div>
    </div>

    <div class="ai-input-row">
      <input id="aiInput" type="text" placeholder="Введите команду..." autocomplete="off"/>
      <button class="btn" id="aiSend">Передать</button>
    </div>
  </div>

  <div class="term-footer">
    <span>МОДУЛЬ 04‑А</span>
    <span id="clock">--:--:--</span>
  </div>
</div>

<script src="ai-core.js"></script>
<script>
/* =========================================================
   1. ОТПЕЧАТОК МЫСЛИ (модуль Thought)
   Хэш текста + снимок состояния → узор 6×6 на canvas 30×30
   ========================================================= */
const Thought = (function(){
  const canvas = document.getElementById('aiThought');
  const box    = document.getElementById('thoughtBox');
  const ctx    = canvas.getContext('2d');
  const N      = 6;
  const CELL   = 30 / N;

  let animTimer = null;

  /* FNV-1a 32-bit */
  function hash32(str){
    let h = 0x811c9dc5;
    for(let i = 0; i < str.length; i++){
      h ^= str.charCodeAt(i);
      h = (h * 0x01000193) >>> 0;
    }
    return h >>> 0;
  }

  function bitsFrom(hash, snap){
    const mix = hash32(
      hash + '|' + snap.power + '|' + snap.shields + '|' + snap.scan
    );
    const bits = [];
    let v = mix;
    for(let i = 0; i < N*N; i++){
      v = ((v * 1103515245) + 12345) >>> 0;
      bits.push((v >>> 16) & 1);
    }
    return bits;
  }

  function draw(bits, alpha){
    ctx.clearRect(0, 0, 30, 30);
    for(let i = 0; i < bits.length; i++){
      const x = i % N, y = Math.floor(i / N);
      if(bits[i]){
        const cyan = (i * 7 + bits.length) % 3 === 0;
        ctx.fillStyle = cyan
          ? `rgba(0,255,224,${alpha})`
          : `rgba(58,169,255,${alpha})`;
        ctx.fillRect(x*CELL + 1, y*CELL + 1, CELL - 2, CELL - 2);
      } else if(alpha > 0.4){
        ctx.fillStyle = `rgba(58,169,255,${alpha * 0.08})`;
        ctx.fillRect(x*CELL + 2, y*CELL + 2, CELL - 4, CELL - 4);
      }
    }
  }

  function buildBase(text, snap){
    return bitsFrom(hash32(text), snap);
  }

  function jitter(bits){
    return bits.map(b => Math.random() < 0.15 ? 1 - b : b);
  }

  function animate(text, snap){
    if(animTimer) clearInterval(animTimer);

    const base = buildBase(text, snap);
    box.classList.add('thinking');

    const start = Date.now();
    const DURATION = 2000;
    const FRAME    = 120;

    animTimer = setInterval(() => {
      const elapsed = Date.now() - start;

      if(elapsed >= DURATION){
        clearInterval(animTimer);
        animTimer = null;
        box.classList.remove('thinking');
        draw(base, 1);
        return;
      }

      const phase = Math.sin(elapsed / 100) * 0.5 + 0.5;
      const alpha = 0.4 + phase * 0.6;
      draw(jitter(base), alpha);
    }, FRAME);
  }

  function freeze(){
    if(animTimer){ clearInterval(animTimer); animTimer = null; }
    box.classList.remove('thinking');
  }

  return { animate, freeze, hash32, buildBase, draw };
})();

/* =========================================================
   2. ОСНОВНОЙ ЦИКЛ ИНТЕРФЕЙСА
   ========================================================= */
(function(){
  const aiWindow = document.getElementById('aiWindow');
  const aiBody   = document.getElementById('aiBody');
  const aiInput  = document.getElementById('aiInput');
  const aiSend   = document.getElementById('aiSend');
  const aiStatus = document.getElementById('aiStatus');
  const statusTx = document.getElementById('statusText');
  const clock    = document.getElementById('clock');

  /* --- часы --- */
  setInterval(()=>{
    clock.textContent = new Date().toLocaleTimeString('ru-RU',{hour12:false});
  }, 1000);

  /* --- инициализация ИИ --- */
  AI.init();

  statusTx.textContent = 'КАНАЛ АКТИВЕН';
  aiStatus.textContent = 'ИИ · ОЖИДАНИЕ ЗАПРОСА';
  aiBody.innerHTML = '';

  /* --- сообщения --- */
  function pushMsg(text, who, extra){
    const d = document.createElement('div');
    d.className = 'ai-msg ' + who + (extra? ' '+extra : '');
    d.textContent = text;
    aiBody.appendChild(d);
    aiBody.scrollTop = aiBody.scrollHeight;
    return d;
  }
  function removeNode(n){ if(n && n.parentNode) n.parentNode.removeChild(n); }

  /* --- приветствие --- */
  const hello = 'Борткомпьютер «ГЕЛИОС‑7» на связи. Все системы номинальны. Жду распоряжений, капитан.';
  pushMsg(hello, 'bot');
  Thought.animate(hello, AI.snapshot());

  /* --- индикация "думает" --- */
  function setThinking(on){
    if(on){
      aiWindow.classList.add('thinking');
      aiStatus.textContent = 'ИИ · АНАЛИЗ';
      statusTx.textContent = 'ОБРАБОТКА ЗАПРОСА';
      let i = 0; const dots = ['·','··','···'];
      aiWindow._timer = setInterval(()=>{
        aiStatus.textContent = 'ИИ · АНАЛИЗ ' + dots[i++ % 3];
      }, 260);
    } else {
      aiWindow.classList.remove('thinking');
      aiStatus.textContent = 'ИИ · ОЖИДАНИЕ ЗАПРОСА';
      statusTx.textContent = 'КАНАЛ АКТИВЕН';
      if(aiWindow._timer){ clearInterval(aiWindow._timer); aiWindow._timer = null; }
    }
  }

  /* --- пузырь "печатает" --- */
  function typingBubble(){
    const d = document.createElement('div');
    d.className = 'ai-msg bot think';
    d.innerHTML = 'анализирую телеметрию<span class="typing"></span>';
    aiBody.appendChild(d);
    aiBody.scrollTop = aiBody.scrollHeight;
    return d;
  }

  /* --- вывод ответа ИИ + отпечаток --- */
  function emitBot(text, extra){
    pushMsg(text, 'bot', extra);
    Thought.animate(text, AI.snapshot());
  }

  /* =========================================================
     ЦИКЛ ОТВЕТА
     ========================================================= */
  function respond(text){
    const t = text.trim();
    if(!t) return;

    pushMsg(t, 'user');
    aiInput.value = '';
    setThinking(true);

    const roll = Math.random();

    /* короткий ввод */
    if(t.length < 2){
      setTimeout(()=>{
        setThinking(false);
        emitBot(AI.clarify());
      }, 500 + Math.random()*400);
      return;
    }

    /* ложное уточнение (7%) */
    if(roll < 0.07){
      setTimeout(()=>{
        setThinking(false);
        emitBot(AI.clarify());
      }, 700 + Math.random()*600);
      return;
    }

    /* перепроверка (10%) */
    if(roll < 0.17){
      const tb = typingBubble();
      setTimeout(()=>{
        removeNode(tb);
        emitBot(AI.recheck(), 'think');
        setTimeout(()=>{
          setThinking(false);
          emitBot(AI.respond(t));
        }, 500 + Math.random()*400);
      }, 700 + Math.random()*500);
      return;
    }

    /* обычный ответ */
    const tb = typingBubble();
    setTimeout(()=>{
      removeNode(tb);
      setThinking(false);
      emitBot(AI.respond(t));
    }, 700 + Math.random()*800);
  }

  aiSend.addEventListener('click', () => respond(aiInput.value));
  aiInput.addEventListener('keydown', e => { if(e.key === 'Enter') respond(aiInput.value); });

  /* =========================================================
     ПАССИВНАЯ АКТИВНОСТЬ
     ========================================================= */
  let idleTimer;
  function armIdle(){
    clearTimeout(idleTimer);
    idleTimer = setTimeout(()=>{
      if(!aiWindow.classList.contains('thinking')){
        emitBot(AI.passive(), 'think');
      }
      armIdle();
    }, 35000 + Math.random()*20000);
  }
  armIdle();
  aiInput.addEventListener('input', armIdle);

  /* =========================================================
     СЮЖЕТНЫЕ СОБЫТИЯ
     ========================================================= */
  setInterval(() => {
    const ev = AI.tickStory();
    if(ev && !aiWindow.classList.contains('thinking')){
      emitBot(ev, 'think');
      AI.pushStory(ev);
    }
  }, 90000);

})();
</script>
</body>
</html>
