<style>
  :root{
    --primary:#1A3A6B;
    --accent:#C8102E;
    --bg:#FFFFFF;
    --surface:#F5F7FA;
    --text:#1C1C1E;
    --muted:#6B7280;
    --divider:#E5E7EB;
    --shadow:0 4px 20px rgba(0,0,0,0.06);
    --hero-grad:linear-gradient(135deg,#1A3A6B 0%,#0D1F3C 100%);
  }
  [data-theme="dark"]{
    --primary:#7DA9E8;
    --accent:#FF4D6D;
    --bg:#0D1117;
    --surface:#161B22;
    --text:#E6EDF3;
    --muted:#8B949E;
    --divider:#30363D;
    --shadow:0 4px 20px rgba(0,0,0,0.3);
    --hero-grad:linear-gradient(135deg,#1F2A44 0%,#0D1117 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-font-smoothing:antialiased;
    transition:background .3s,color .3s;
  }
  h1,h2,h3{font-family:'Montserrat',sans-serif;color:var(--primary);line-height:1.2;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:260px;background:var(--bg);
    border-right:1px solid var(--divider);
    padding:20px 0;
    position:fixed;top:0;left:0;bottom:0;
    overflow-y:auto;transition:transform .3s ease;
    z-index:100;
  }
  .brand{display:flex;align-items:center;gap:12px;padding:0 20px 20px;border-bottom:1px solid var(--divider);margin-bottom:16px;}
  .brand-logo{
    width:44px;height:44px;background:var(--hero-grad);
    border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:22px;
  }
  .brand-text h1{font-size:16px;font-weight:800;color:var(--primary);}
  .brand-text p{font-size:12px;color:var(--muted);}

  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 20px;
    cursor:pointer;color:var(--primary);font-size:14.5px;font-weight:500;
    transition:background .15s;border-left:3px solid transparent;
  }
  .nav-item:hover{background:var(--surface);}
  .nav-item.active{background:var(--surface);border-left-color:var(--accent);font-weight:600;}
  .nav-item .ico{font-size:18px;width:22px;text-align:center;}

  /* Main */
  .main{flex:1;margin-left:260px;padding:32px 40px 80px;max-width:1000px;}

  /* Topbar */
  .topbar{
    display:none;position:sticky;top:0;
    background:color-mix(in srgb, var(--bg) 95%, transparent);
    backdrop-filter:blur(10px);
    padding:12px 16px;border-bottom:1px solid var(--divider);
    z-index:50;align-items:center;gap:12px;
  }
  .burger{font-size:22px;cursor:pointer;background:none;border:none;color:var(--primary);padding:6px 10px;border-radius:8px;}
  .burger:hover{background:var(--surface);}
  .topbar-title{font-weight:700;color:var(--primary);font-size:15px;flex:1;}

  /* Toolbar */
  .toolbar{
    display:flex;gap:8px;justify-content:flex-end;
    margin-bottom:20px;flex-wrap:wrap;
  }
  .tool-btn{
    background:var(--surface);border:1px solid var(--divider);
    color:var(--primary);padding:8px 14px;border-radius:10px;
    cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;
    display:flex;align-items:center;gap:6px;
    transition:all .15s;
  }
  .tool-btn:hover{background:var(--bg);border-color:var(--primary);transform:translateY(-1px);}
  .tool-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

  /* Screens */
  .screen{display:none;animation:fade .3s ease;}
  .screen.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .screen-title{font-size:28px;font-weight:800;margin-bottom:6px;}
  .screen-sub{color:var(--muted);font-size:14px;margin-bottom:24px;}

 /* Hero */
.hero{
  background:var(--hero-grad);color:#fff;border-radius:20px;
  padding:36px 32px;margin-bottom:28px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:24px;
}
.hero::after{
  content:'';position:absolute;right:-60px;top:-60px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(200,16,46,.35),transparent 70%);
}
.hero-text{flex:1;}
.hero-img{
  width:220px;height:220px;
  object-fit:cover;
  border-radius:16px;
  border:2px solid rgba(255,255,255,.2);
  flex-shrink:0;
  position:relative;z-index:1;
}
.hero h1{color:#fff;font-size:34px;font-weight:800;margin-bottom:8px;}
.hero p{color:#C8D6E5;font-size:14.5px;max-width:480px;margin-bottom:20px;}
.hero .btn{
  background:var(--accent);color:#fff;border:none;padding:12px 24px;
  border-radius:12px;font-weight:600;font-size:14.5px;cursor:pointer;
  font-family:inherit;transition:transform .15s,box-shadow .15s;
}
.hero .btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(200,16,46,.35);}

@media (max-width:640px){
  .hero{flex-direction:column-reverse;text-align:center;}
  .hero-img{width:160px;height:160px;}
}

  /* Cards */
  .card{
    background:var(--bg);border:1px solid var(--divider);
    border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow);
  }
  .card h3{font-size:17px;font-weight:700;margin-bottom:14px;}
  .card p{font-size:15px;color:var(--text);}
  .card.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
  .card.primary h3,.card.primary p{color:#fff;}

  /* Table */
  .itable{border:1px solid var(--divider);border-radius:12px;overflow:hidden;}
  .itable .row{
    display:grid;grid-template-columns:1fr 1.4fr;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--divider);font-size:14.5px;
  }
  .itable .row:last-child{border-bottom:none;}
  .itable .row .k{font-weight:600;color:var(--primary);}
  .itable .row .v{color:var(--text);}

  /* Quote */
  .quote{background:var(--surface);border-left:4px solid var(--accent);border-radius:12px;padding:20px 24px;margin-bottom:18px;}
  .quote p{font-style:italic;color:var(--primary);font-size:16px;font-weight:500;}
  .quote span{display:block;margin-top:10px;font-size:13px;color:var(--muted);font-style:normal;}

  /* Stats */
  .stat-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;}
  .stat-row .label{font-size:14.5px;}
  .stat-row .badge{background:rgba(200,16,46,.1);color:var(--accent);font-weight:700;font-size:13px;padding:5px 12px;border-radius:8px;}

  /* Progress */
  .progress{margin-bottom:14px;}
  .progress .line{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px;}
  .progress .line b{font-weight:700;}
  .progress .bar{height:8px;background:var(--divider);border-radius:6px;overflow:hidden;}
  .progress .bar > div{height:100%;border-radius:6px;}

  /* List */
  .list{list-style:none;}
  .list li{display:flex;gap:12px;padding:8px 0;font-size:14.5px;align-items:flex-start;}
  .list li::before{content:'✓';color:var(--accent);font-weight:700;flex-shrink:0;}
  .list.cross li::before{content:'✕';}
  .list.num{counter-reset:n;}
  .list.num li{counter-increment:n;}
  .list.num li::before{
    content:counter(n);background:var(--primary);color:#fff;
    width:24px;height:24px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;font-size:12px;
  }

  /* Pyramid */
  .pyramid-step{
    background:var(--surface);border:1px solid var(--divider);
    border-radius:10px;padding:12px 16px;text-align:center;
    font-size:14px;font-weight:600;color:var(--primary);margin-bottom:6px;
  }
  .pyramid-step.top{background:rgba(200,16,46,.1);border-color:var(--accent);color:var(--accent);}
  .pyramid-arrow{text-align:center;color:var(--muted);margin:2px 0;font-size:14px;}

  /* Chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{background:var(--surface);border:1px solid var(--divider);padding:7px 14px;border-radius:20px;font-size:13.5px;}

  /* Violations */
  .violation{
    display:flex;gap:12px;padding:12px;
    background:rgba(200,16,46,.05);
    border:1px solid rgba(200,16,46,.2);
    border-radius:10px;margin-bottom:8px;align-items:flex-start;
  }
  .violation .art{background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;flex-shrink:0;}
  .violation .desc{font-size:14px;}

  /* News */
  .news-item{
    display:flex;gap:16px;padding:18px;
    background:var(--bg);border:1px solid var(--divider);
    border-radius:14px;margin-bottom:12px;
    box-shadow:var(--shadow);
  }
  .news-date{
    background:var(--primary);color:#fff;
    padding:8px 12px;border-radius:10px;
    font-size:12px;font-weight:700;text-align:center;
    flex-shrink:0;min-width:70px;
  }
  .news-body h3{font-size:16px;margin-bottom:6px;color:var(--primary);}
  .news-body p{font-size:14px;color:var(--text);}
  .news-tag{
    display:inline-block;background:var(--surface);
    color:var(--muted);font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:6px;margin-top:8px;
  }

  /* Splash */
  #splash{
    position:fixed;inset:0;background:var(--hero-grad);
    display:flex;align-items:center;justify-content:center;
    z-index:9999;transition:opacity .5s;
  }
  #splash.hide{opacity:0;pointer-events:none;}
  .splash-inner{text-align:center;color:#fff;animation:pop .8s ease;}
  .splash-logo{
    width:110px;height:110px;background:rgba(255,255,255,.1);
    border:2px solid rgba(255,255,255,.2);border-radius:28px;
    display:flex;align-items:center;justify-content:center;
    font-size:52px;margin:0 auto 24px;
  }
  .splash-inner h1{color:#fff;font-size:22px;font-weight:700;}
  .splash-inner p{color:#C8D6E5;font-size:13px;margin-top:8px;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* Overlay */
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;}
  .overlay.show{display:block;}

  /* Mobile */
  @media (max-width:860px){
    .sidebar{transform:translateX(-100%);}
    .sidebar.open{transform:translateX(0);}
    .main{margin-left:0;padding:16px;}
    .topbar{display:flex;}
    .hero h1{font-size:26px;}
    .hero{padding:28px 22px;}
    .screen-title{font-size:22px;}
    .toolbar{justify-content:flex-start;}
    .news-item{flex-direction:column;}
    .news-date{min-width:auto;align-self:flex-start;}
  }
</style>
</head>

/* ============================================================
   3. ЛОГИКА
   ============================================================ */
let LANG = localStorage.getItem('nppr_lang') || 'ru';
let THEME = localStorage.getItem('nppr_theme') || 'light';

function t(key){
  return (I18N[LANG] && I18N[LANG][key]) || (EXTRA[LANG] && EXTRA[LANG][key]) || key;
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const val = t(key);
    if(val && val !== key) el.textContent = val;
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.dataset.i18nHtml;
    const val = t(key);
    if(val && val !== key) el.innerHTML = val;
  });

  const langLabel = document.getElementById('langLabel');
  if (langLabel) langLabel.textContent = LANG === 'ru' ? 'EN' : 'RU';

  const shareEl = document.querySelector('[data-i18n="share"]');
  if (shareEl) shareEl.textContent = t('share');

  const dlEl = document.querySelector('[data-i18n="download"]');
  if (dlEl) dlEl.textContent = t('download');

  const themeEl = document.querySelector('[data-i18n="theme_label"]');
  if (themeEl) themeEl.textContent = t('theme_label');

  buildNav();
  buildNews();
}

function buildNav(){
  const nav = document.getElementById('nav');
  const activeId = document.querySelector('.screen.active')?.id.replace('screen-','') || 'home';
  nav.innerHTML = NAV.map(n => `
    <div class="nav-item ${n.id===activeId?'active':''}" data-screen="${n.id}">
      <span class="ico">${n.ico}</span><span>${t(n.key)}</span>
    </div>
  `).join('');
  nav.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => go(item.dataset.screen));
  });
}

function buildNews(){
  const box = document.getElementById('newsList');
  if(!box) return;
  box.innerHTML = NEWS.map(n => {
    const local = n[LANG] || n.ru;
    const d = new Date(n.date);
    const dateStr = d.toLocaleDateString(LANG === 'ru' ? 'ru-RU' : 'en-GB', {day:'2-digit', month:'short', year:'numeric'});
    return `
      <div class="news-item">
        <div class="news-date">${dateStr}</div>
        <div class="news-body">
          <h3>${local.title}</h3>
          <p>${local.desc}</p>
          <span class="news-tag">${local.tag}</span>
        </div>
      </div>`;
  }).join('');
}

function go(name){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('screen-' + name);
  if(target) target.classList.add('active');
  buildNav();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  window.scrollTo({top:0, behavior:'smooth'});
}

function applyTheme(){
  document.documentElement.dataset.theme = THEME;
  document.getElementById('themeIcon').textContent = THEME === 'dark' ? '☀️' : '🌙';
}

/* ===== INIT ===== */
document.addEventListener('DOMContentLoaded', () => {
  renderScreens();
  applyTheme();
  applyLang();          // ← ВЕРНУЛИ. Заполняет все data-i18n
  buildControlSteps();
  buildViolations();
  buildNews();

  // lang toggle
  document.getElementById('langToggle').addEventListener('click', () => {
    LANG = LANG === 'ru' ? 'en' : 'ru';
    localStorage.setItem('nppr_lang', LANG);
    applyLang();
   // buildControlSteps();
   // buildViolations();
  });

  // theme toggle
  document.getElementById('themeToggle').addEventListener('click', () => {
    THEME = THEME === 'dark' ? 'light' : 'dark';
    localStorage.setItem('nppr_theme', THEME);
    applyTheme();
  });

  // share
  document.getElementById('shareBtn').addEventListener('click', async () => {
    const data = {
      title: t('brand_full'),
      text: t('tagline'),
      url: location.href
    };
    if(navigator.share){
      try { await navigator.share(data); } catch(e){}
    } else {
      await navigator.clipboard.writeText(location.href);
      alert(LANG === 'ru' ? 'Ссылка скопирована' : 'Link copied');
    }
  });

  // mobile menu
  const burger = document.getElementById('burger');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  burger.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
  });
  overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  });

  // splash
  setTimeout(() => document.getElementById('splash').classList.add('hide'), 2000);

  // PWA manifest
  const manifest = {
    name: 'НППР — Власть Народу',
    short_name: 'НППР',
    start_url: '.',
    display: 'standalone',
    background_color: '#1A3A6B',
    theme_color: '#1A3A6B',
    icons: [{
      src: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⭐</text></svg>',
      sizes: '192x192', type: 'image/svg+xml'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/json'});
  const link = document.createElement('link');
  link.rel = 'manifest';
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
});

/* ===== Контроль: шаги ===== */
function buildControlSteps(){
  const steps_ru = [
    'ИДЖН — федеральный уровень','ИДЖН — региональный уровень',
    'ИДЖН — муниципальный уровень','Отчёт Правительства перед Госдумой',
    'Содоклад научных экспертов','«Красные флажки» — предельные значения',
    'Отставка Премьера при нарушении'
  ];
  const steps_en = [
    'IDLP — federal level','IDLP — regional level',
    'IDLP — municipal level','Government report to the State Duma',
    'Co-report of scientific experts','"Red flags" — limit values',
    'Resignation of the Prime Minister in case of violation'
  ];
  const steps = LANG === 'ru' ? steps_ru : steps_en;
  const c = document.getElementById('controlSteps');
  if(!c) return;
  c.innerHTML = '';
  steps.forEach((s, i) => {
    const isLast = i === steps.length - 1;
    const div = document.createElement('div');
    div.style.cssText = `display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;margin-bottom:6px;background:${isLast?'rgba(200,16,46,.08)':'var(--surface)'};border:1px solid ${isLast?'var(--accent)':'var(--divider)'};font-size:14px;font-weight:500;`;
    div.innerHTML = `<span style="width:26px;height:26px;border-radius:50%;background:${isLast?'var(--accent)':'var(--primary)'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;">${i+1}</span><span>${s}</span>`;
    c.appendChild(div);
    if(!isLast){
      const a = document.createElement('div');
      a.style.cssText = 'text-align:center;color:var(--muted);margin:2px 0;font-size:14px;';
      a.textContent = '↓';
      c.appendChild(a);
    }
  });
}
