      formula: "Условие возникновения детонации: $T_c > T_{сам}$, где $T_c$ — температура в конце сжатия, $T_{сам}$ — температура самовоспламенения топлива. При этом $T_c = T_a \\cdot \\varepsilon^{k-1}$.",
      meaning: "Чем выше $\\varepsilon$, тем выше $T_c$ и $p_c$, тем ближе момент, когда смесь самовоспламенится до прихода фронта пламени от искры.",
      in_ice: "Меры борьбы: повышение октанового числа топлива, снижение $\\varepsilon$, расслоение смеси, непосредственный впрыск, рециркуляция отработавших газов (EGR)."
    }
  }
];

let current = 0;
let score = 0;
let answered = false;

const qEl = document.getElementById('questionText');
const optEl = document.getElementById('options');
const expEl = document.getElementById('explanation');
const theoryBtnWrap = document.getElementById('theoryBtnWrap');
const theoryEl = document.getElementById('theory');
const nextBtn = document.getElementById('nextBtn');
const progressEl = document.getElementById('progress');
const progressFill = document.getElementById('progressFill');
const scoreVal = document.getElementById('scoreVal');
const scoreTotal = document.getElementById('scoreTotal');

function render() {
  answered = false;
  const q = questions[current];
  qEl.textContent = q.q;
  optEl.innerHTML = '';
  expEl.className = 'explanation';
  expEl.innerHTML = '';
  theoryBtnWrap.innerHTML = '';
  theoryEl.className = 'theory';
  theoryEl.innerHTML = '';
  nextBtn.disabled = true;

  q.options.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.innerHTML = opt;
    div.onclick = () => selectAnswer(i, div);
    optEl.appendChild(div);
  });

  progressEl.textContent = `Вопрос ${current + 1} из ${questions.length}`;
  progressFill.style.width = ((current) / questions.length * 100) + '%';
  scoreTotal.textContent = questions.length;
  scoreVal.textContent = score;
}

function selectAnswer(idx, el) {
  if (answered) return;
  answered = true;

  const q = questions[current];
  const allOptions = optEl.querySelectorAll('.option');
  allOptions.forEach(o => o.classList.add('disabled'));

  if (idx === q.correct) {
    el.classList.add('correct');
    score++;
    scoreVal.textContent = score;
    expEl.className = 'explanation show ok';
    expEl.innerHTML = '<strong>✅ Верно!</strong>' + q.explanation;
  } else {
    el.classList.add('wrong');
    allOptions[q.correct].classList.add('correct');
    expEl.className = 'explanation show bad';
    expEl.innerHTML = '<strong>❌ Неверно.</strong>' + q.explanation;
  }

  // Кнопка теории
  if (q.theory) {
    const btn = document.createElement('div');
    btn.className = 'theory-toggle';
    btn.textContent = '📖 Показать теорию';
    btn.onclick = () => {
      theoryEl.classList.toggle('show');
      btn.textContent = theoryEl.classList.contains('show')
        ? '📖 Скрыть теорию'
        : '📖 Показать теорию';
      if (theoryEl.classList.contains('show') && window.MathJax) {
        MathJax.typesetPromise([theoryEl]);
      }
    };
    theoryBtnWrap.appendChild(btn);

    theoryEl.innerHTML = `
      <h4>Теория</h4>
      <div class="item"><span class="label">Определение.</span> ${q.theory.definition}</div>
      <div class="item"><span class="label">Формула.</span> ${q.theory.formula}</div>
      <div class="item"><span class="label">Смысл.</span> ${q.theory.meaning}</div>
      <div class="item"><span class="label">В ДВС.</span> ${q.theory.in_ice}</div>
    `;
  }

  nextBtn.disabled = false;
}

nextBtn.onclick = () => {
  current++;
  if (current < questions.length) {
    render();
  } else {
    showFinal();
  }
};

function showFinal() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('finalArea').style.display = 'block';
  progressFill.style.width = '100%';
  progressEl.textContent = 'Завершено';

  document.getElementById('finalScore').textContent = score + ' / ' + questions.length;
  const pct = score / questions.length * 100;
  let msg = '';
  if (pct >= 90) msg = 'Отличный результат! Материал усвоен.';
  else if (pct >= 70) msg = 'Хороший результат, но есть пробелы. Повторите слабые темы.';
  else if (pct >= 50) msg = 'Удовлетворительно. Нужно вернуться к учебнику Луканина.';
  else msg = 'Слабый результат. Рекомендуется повторить теорию циклов с нуля.';
  document.getElementById('finalMsg').textContent = msg;
}

render();
</script>
</body>
</html>
