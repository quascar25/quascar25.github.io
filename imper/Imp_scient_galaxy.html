<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Imperial Scientist's Terminal_</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #000;
    color: #c8d0d8;
    font-family: "Courier New", monospace;
  }

  /* Космический фон: звёзды через радиальные градиенты */
  body {
    background:
      radial-gradient(1px 1px at 10% 20%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 30% 70%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 70% 40%, #fff 100%, transparent 100%),
      radial-gradient(2px 2px at 85% 15%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 50% 90%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 20% 55%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 90% 80%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 40% 10%, #fff 100%, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 60%, #fff 100%, transparent 100%),
      radial-gradient(1px 1px at 5% 85%, #fff 100%, transparent 100%),
      radial-gradient(ellipse at 50% 50%, #0a1420 0%, #000 70%);
    background-repeat: no-repeat;
    background-size: 100% 100%;
  }

  h1 {
    text-align: center;
    font-size: 22px;
    letter-spacing: 3px;
    color: #a8c0d0;
    margin: 20px 0 10px 0;
    text-shadow: 0 0 8px #3050a0;
  }

  .panel {
    width: 80%;
    max-width: 900px;
    margin: 0 auto;
    border: 1px solid #888;
    background: rgba(20, 25, 30, 0.85);
    padding: 20px;
  }

  .panel-title {
    font-size: 16px;
    color: #d0d8e0;
    margin-bottom: 12px;
    letter-spacing: 2px;
  }

  .inner-panel {
    border: 1px solid #888;
    background: rgba(10, 15, 20, 0.9);
    padding: 15px;
    min-height: 200px;
    margin-bottom: 15px;
  }

  .controls {
    display: flex;
    gap: 15px;
  }

  button {
    flex: 1;
    background: transparent;
    color: #c8d0d8;
    border: 1px solid #888;
    padding: 10px;
    font-family: "Courier New", monospace;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 1px;
  }

  button:hover {
    border-color: #a0c0e0;
    color: #e0f0ff;
  }

  button:active {
    background: rgba(80, 120, 180, 0.2);
  }

  pre {
    margin: 0;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.4;
    color: #b0d0b0;
  }
</style>
</head>
<body>

<h1>IMPERIAL SCIENTIST'S TERMINAL OF THE GALAXY</h1>

<div class="panel">
  <div class="panel-title">// SYMMETRY GENERATOR</div>

  <div class="inner-panel" id="output">
    <pre>> Ожидание команды...</pre>
  </div>

  <div class="controls">
    <button id="btn-generate">ГЕНЕРАТОР ЗНАЧЕНИЙ</button>
    <button id="btn-symmetry">СИММЕТРИИ ХАОСА</button>
  </div>
</div>

<script src="XXXP_NP.js"></script>
<script>
  const output = document.getElementById('output');

  function print(text) {
    output.innerHTML = '<pre>' + text + '</pre>';
  }

  document.getElementById('btn-generate').addEventListener('click', async () => {
    print('> Генерация пар...');
    // небольшая задержка, чтобы интерфейс успел обновиться
    setTimeout(async () => {
      try {
        const res = await window.XXXP_NP.generate();
        print(res);
      } catch (e) {
        print('> ОШИБКА: ' + e.message);
      }
    }, 50);
  });

  document.getElementById('btn-symmetry').addEventListener('click', async () => {
    print('> Поиск симметрий в хаосе...');
    setTimeout(async () => {
      try {
        const res = await window.XXXP_NP.findSymmetry();
        print(res);
      } catch (e) {
        print('> ОШИБКА: ' + e.message);
      }
    }, 50);
  });
</script>

</body>
</html>
